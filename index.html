<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>LagerManager Pro</title>
    
    <!-- iOS WebApp Capable (Damit es wie eine App aussieht) -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="LagerApp">
    <link rel="apple-touch-icon" href="https://img.icons8.com/isometric/512/box.png">

    <!-- Tailwind CSS & Lucide Icons für Apple-Look -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", sans-serif;
            background-color: #F2F2F7;
            -webkit-tap-highlight-color: transparent;
        }
        /* Apple Glassmorphism Effect */
        .glass {
            background: rgba(255, 255, 255, 0.75);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.3);
        }
    </style>
</head>
<body class="text-slate-900 pb-24 select-none">

    <!-- Auth Modal / Login (Apple Style) -->
    <div id="auth-screen" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/40 backdrop-blur-md">
        <div class="glass-card w-full max-w-sm p-6 rounded-3xl shadow-2xl text-center space-y-5">
            <div class="w-16 h-16 bg-blue-500 rounded-2xl flex items-center justify-center mx-auto text-white shadow-lg shadow-blue-500/30">
                <i data-lucide="box" class="w-8 h-8"></i>
            </div>
            <div>
                <h1 class="text-2xl font-bold tracking-tight">LagerManager</h1>
                <p class="text-xs text-gray-500 mt-1">Anmeldung für Mitarbeiter</p>
            </div>
            
            <div class="space-y-3">
                <button onclick="loginWithGoogle()" class="w-full bg-white hover:bg-gray-50 border border-gray-200 text-gray-700 font-semibold py-3 px-4 rounded-xl flex items-center justify-center gap-2 shadow-sm transition-all active:scale-95">
                    <svg class="w-5 h-5" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/></svg>
                    Mit Google anmelden
                </button>
                <div class="relative py-2">
                    <div class="absolute inset-0 flex items-center"><div class="w-full border-t border-gray-200"></div></div>
                    <div class="relative flex justify-center"><span class="bg-white/80 px-2 text-xs text-gray-400">oder E-Mail</span></div>
                </div>
                <input type="email" id="email" placeholder="name@firma.de" class="w-full px-4 py-3 rounded-xl bg-gray-100/80 border-none text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                <button onclick="loginWithEmail()" class="w-full bg-blue-500 hover:bg-blue-600 text-white font-semibold py-3 rounded-xl shadow-lg shadow-blue-500/20 active:scale-95 transition-all">Anmelden</button>
            </div>
        </div>
    </div>

    <!-- Main App Container -->
    <div id="app" class="hidden max-w-md mx-auto">
        <!-- iOS Style Header -->
        <header class="sticky top-0 z-40 glass border-b border-gray-200/50 px-5 pt-12 pb-4 flex justify-between items-end">
            <div>
                <p class="text-xs font-semibold text-gray-400 uppercase tracking-wider">Lagerbestand</p>
                <h1 class="text-2xl font-bold tracking-tight">Übersicht</h1>
            </div>
            <button onclick="openAddModal()" class="w-9 h-9 bg-blue-500 text-white rounded-full flex items-center justify-center shadow-md active:scale-90 transition-transform">
                <i data-lucide="plus" class="w-5 h-5"></i>
            </button>
        </header>

        <!-- Dynamic Warnings (Low Stock) -->
        <div id="warning-banner" class="p-4 hidden">
            <div class="bg-red-500/10 border border-red-500/20 rounded-2xl p-4 flex items-start gap-3">
                <i data-lucide="alert-triangle" class="w-5 h-5 text-red-500 shrink-0 mt-0.5"></i>
                <div>
                    <h4 class="text-sm font-semibold text-red-600">Niedriger Lagerbestand!</h4>
                    <p id="warning-text" class="text-xs text-red-500/90 mt-0.5">Einige Produkte haben den Mindestbestand unterschritten.</p>
                </div>
            </div>
        </div>

        <!-- Inventory List -->
        <div class="px-4 mt-2 space-y-3" id="product-list">
            <!-- Dynamisch generierte Produkte landen hier -->
        </div>
    </div>

    <!-- Bottom iOS Navigation Bar -->
    <nav id="navbar" class="hidden fixed bottom-0 left-0 right-0 glass border-t border-gray-200/50 px-6 py-3 flex justify-around items-center z-40">
        <button class="flex flex-col items-center text-blue-500">
            <i data-lucide="boxes" class="w-6 h-6"></i>
            <span class="text-[10px] mt-1 font-medium">Lager</span>
        </button>
        <button onclick="alert('Mitarbeiter-Verwaltung active')" class="flex flex-col items-center text-gray-400 hover:text-gray-600">
            <i data-lucide="users" class="w-6 h-6"></i>
            <span class="text-[10px] mt-1 font-medium">Team</span>
        </button>
        <button onclick="logout()" class="flex flex-col items-center text-gray-400 hover:text-gray-600">
            <i data-lucide="log-out" class="w-6 h-6"></i>
            <span class="text-[10px] mt-1 font-medium">Account</span>
        </button>
    </nav>

    <!-- Modal: Produkt hinzufügen -->
    <div id="add-modal" class="hidden fixed inset-0 z-50 bg-black/40 backdrop-blur-sm flex items-end sm:items-center justify-center">
        <div class="bg-white w-full max-w-md rounded-t-3xl sm:rounded-3xl p-6 space-y-4 animate-in slide-in-from-bottom duration-200">
            <div class="flex justify-between items-center">
                <h3 class="text-lg font-bold">Neues Produkt</h3>
                <button onclick="closeAddModal()" class="text-gray-400"><i data-lucide="x" class="w-6 h-6"></i></button>
            </div>
            <input type="text" id="prod-name" placeholder="Produktname" class="w-full px-4 py-3 rounded-xl bg-gray-100 text-sm focus:outline-none">
            <div class="grid grid-cols-2 gap-3">
                <div>
                    <label class="text-xs text-gray-400 ml-1">Anfangsbestand</label>
                    <input type="number" id="prod-stock" value="10" class="w-full px-4 py-3 rounded-xl bg-gray-100 text-sm focus:outline-none">
                </div>
                <div>
                    <label class="text-xs text-gray-400 ml-1">Mindestbestand</label>
                    <input type="number" id="prod-min" value="3" class="w-full px-4 py-3 rounded-xl bg-gray-100 text-sm focus:outline-none">
                </div>
            </div>
            <button onclick="addProduct()" class="w-full bg-blue-500 text-white font-semibold py-3 rounded-xl shadow-lg shadow-blue-500/30">Hinzufügen</button>
        </div>
    </div>

    <script>
        // Lucide Icons initialisieren
        lucide.createIcons();

        // Beispiel-Datenstruktur
        let products = [
            { id: 1, name: "Kaffeebohnen 1kg", stock: 12, minStock: 5 },
            { id: 2, name: "Druckerpapier A4", stock: 2, minStock: 4 },
            { id: 3, name: "Kartons (Größe M)", stock: 45, minStock: 10 }
        ];

        // Anmelde-Simulation
        function loginWithGoogle() { loginSuccess(); }
        function loginWithEmail() { 
            if(document.getElementById('email').value) loginSuccess(); 
            else alert("Bitte E-Mail eingeben");
        }

        function loginSuccess() {
            document.getElementById('auth-screen').classList.add('hidden');
            document.getElementById('app').classList.remove('hidden');
            document.getElementById('navbar').classList.remove('hidden');
            renderProducts();
            requestNotificationPermission();
        }

        function logout() {
            document.getElementById('auth-screen').classList.remove('hidden');
            document.getElementById('app').classList.add('hidden');
            document.getElementById('navbar').classList.add('hidden');
        }

        // Lagerbestand anzeigen
        function renderProducts() {
            const list = document.getElementById('product-list');
            list.innerHTML = '';
            let lowStockCount = 0;

            products.forEach(p => {
                const isLow = p.stock <= p.minStock;
                if(isLow) lowStockCount++;

                list.innerHTML += `
                    <div class="glass-card p-4 rounded-2xl flex items-center justify-between shadow-sm">
                        <div>
                            <h3 class="font-semibold text-sm">${p.name}</h3>
                            <p class="text-xs ${isLow ? 'text-red-500 font-medium' : 'text-gray-400'}">
                                Bestand: <span class="font-bold text-slate-800">${p.stock}</span> (Min: ${p.minStock})
                            </p>
                        </div>
                        <div class="flex items-center gap-2">
                            <button onclick="updateStock(${p.id}, -1)" class="w-9 h-9 bg-gray-100 hover:bg-gray-200 text-slate-700 rounded-xl flex items-center justify-center font-bold text-lg active:scale-90 transition-transform">-</button>
                            <button onclick="updateStock(${p.id}, 1)" class="w-9 h-9 bg-blue-50 text-blue-600 hover:bg-blue-100 rounded-xl flex items-center justify-center font-bold text-lg active:scale-90 transition-transform">+</button>
                        </div>
                    </div>
                `;
            });

            // Warn-Banner anzeigen
            const warningBanner = document.getElementById('warning-banner');
            if(lowStockCount > 0) {
                warningBanner.classList.remove('hidden');
                document.getElementById('warning-text').innerText = `${lowStockCount} Produkt(e) haben den Mindestbestand unterschritten!`;
            } else {
                warningBanner.classList.add('hidden');
            }
        }

        // Bestände ändern (+ / -)
        function updateStock(id, change) {
            const prod = products.find(p => p.id === id);
            if(prod) {
                prod.stock = Math.max(0, prod.stock + change);
                renderProducts();
                
                if(prod.stock <= prod.minStock && change < 0) {
                    sendNotification(`Warnung: ${prod.name}`, `Bestand ist auf ${prod.stock} gefallen!`);
                }
            }
        }

        // Modals
        function openAddModal() { document.getElementById('add-modal').classList.remove('hidden'); }
        function closeAddModal() { document.getElementById('add-modal').classList.add('hidden'); }

        function addProduct() {
            const name = document.getElementById('prod-name').value;
            const stock = parseInt(document.getElementById('prod-stock').value) || 0;
            const min = parseInt(document.getElementById('prod-min').value) || 0;

            if(name) {
                products.push({ id: Date.now(), name, stock, minStock: min });
                renderProducts();
                closeAddModal();
                document.getElementById('prod-name').value = '';
            }
        }

        // Browser / Smartphone Benachrichtigungen
        function requestNotificationPermission() {
            if ("Notification" in window && Notification.permission !== "granted") {
                Notification.requestPermission();
            }
        }

        function sendNotification(title, body) {
            if ("Notification" in window && Notification.permission === "granted") {
                new Notification(title, { body, icon: 'https://img.icons8.com/isometric/512/box.png' });
            }
        }
    </script>
</body>
</html>
