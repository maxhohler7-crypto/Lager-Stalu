<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>LagerManager</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-gray-100 text-gray-900 font-sans min-h-screen">

    <script>
        const SUPABASE_URL = 'https://rcyxndcehfqrsngbmbpy.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_GQykkrMBRLmtWb8qPZVW9w_875r7bAz';
        const db = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    </script>

    <!-- Login & Registrierung -->
    <div id="auth-screen" class="min-h-screen flex items-center justify-center p-4">
        <div class="bg-white p-8 rounded-3xl shadow-xl max-w-sm w-full space-y-6 text-center">
            <div class="w-16 h-16 bg-blue-100 text-blue-600 rounded-2xl flex items-center justify-center mx-auto">
                <i data-lucide="box" class="w-8 h-8"></i>
            </div>
            <div>
                <h1 class="text-2xl font-bold text-gray-900">LagerManager</h1>
                <p class="text-xs text-gray-500 mt-1">Anmeldung mit E-Mail & Passwort</p>
            </div>
            <form onsubmit="handleAuth(event)" class="space-y-3">
                <input type="email" id="email-input" placeholder="E-Mail Adresse" required class="w-full px-4 py-3 rounded-xl bg-gray-100 border-none text-sm focus:ring-2 focus:ring-blue-500">
                <input type="password" id="password-input" placeholder="Passwort" required class="w-full px-4 py-3 rounded-xl bg-gray-100 border-none text-sm focus:ring-2 focus:ring-blue-500">
                
                <div class="pt-2 space-y-2">
                    <button type="submit" id="login-btn" onclick="authMode = 'login'" class="w-full py-3 bg-blue-600 hover:bg-blue-700 text-white font-medium rounded-xl shadow-md text-sm">
                        Anmelden
                    </button>
                    <button type="submit" id="signup-btn" onclick="authMode = 'signup'" class="w-full py-3 bg-gray-100 hover:bg-gray-200 text-gray-700 font-medium rounded-xl text-sm">
                        Neues Konto erstellen
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- Haupt-App -->
    <div id="app-screen" class="hidden max-w-md mx-auto min-h-screen flex flex-col pb-20">
        <header class="bg-white border-b border-gray-200 px-5 py-4 flex items-center justify-between sticky top-0 z-10">
            <div>
                <h2 class="text-lg font-bold text-gray-900">Lagerbestand</h2>
                <p id="user-email" class="text-xs text-gray-400"></p>
            </div>
            <div class="flex items-center space-x-2">
                <button onclick="openModal()" class="w-10 h-10 bg-blue-600 text-white rounded-full flex items-center justify-center shadow-md">
                    <i data-lucide="plus" class="w-5 h-5"></i>
                </button>
                <button onclick="logout()" class="w-10 h-10 bg-gray-100 text-gray-500 rounded-full flex items-center justify-center">
                    <i data-lucide="log-out" class="w-4 h-4"></i>
                </button>
            </div>
        </header>

        <main class="p-5 flex-1 space-y-3" id="product-list">
            <div class="text-center text-gray-400 py-10 text-sm">Produkte werden geladen...</div>
        </main>
    </div>

    <!-- Modal für neues Produkt -->
    <div id="product-modal" class="fixed inset-0 bg-black/40 hidden flex items-center justify-center p-4 z-50">
        <div class="bg-white rounded-3xl p-6 max-w-sm w-full space-y-4 shadow-2xl">
            <div class="flex justify-between items-center">
                <h3 class="text-base font-bold text-gray-900">Neues Produkt</h3>
                <button onclick="closeModal()" class="text-gray-400"><i data-lucide="x" class="w-5 h-5"></i></button>
            </div>
            <div class="space-y-3">
                <input type="text" id="prod-name" placeholder="Produktname" class="w-full px-3.5 py-2.5 bg-gray-100 rounded-xl text-sm focus:ring-2 focus:ring-blue-500">
                <input type="number" id="prod-stock" placeholder="Anfangsbestand" class="w-full px-3.5 py-2.5 bg-gray-100 rounded-xl text-sm focus:ring-2 focus:ring-blue-500">
            </div>
            <div class="flex space-x-2 pt-2">
                <button onclick="closeModal()" class="flex-1 py-2.5 bg-gray-100 text-gray-600 rounded-xl font-medium text-sm">Abbrechen</button>
                <button onclick="saveProduct()" class="flex-1 py-2.5 bg-blue-600 text-white rounded-xl font-medium text-sm">Speichern</button>
            </div>
        </div>
    </div>

    <script>
        let allProducts = [];
        let authMode = 'login';

        window.onload = async () => {
            lucide.createIcons();
            const { data: { session } } = await db.auth.getSession();
            if (session) showApp(session.user);

            db.auth.onAuthStateChange((_event, session) => {
                if (session) showApp(session.user);
                else showAuth();
            });
        };

        function showApp(user) {
            document.getElementById('auth-screen').classList.add('hidden');
            document.getElementById('app-screen').classList.remove('hidden');
            document.getElementById('user-email').innerText = user.email;
            fetchProducts();
        }

        function showAuth() {
            document.getElementById('auth-screen').classList.remove('hidden');
            document.getElementById('app-screen').classList.add('hidden');
        }

        async function handleAuth(event) {
            event.preventDefault();
            const email = document.getElementById('email-input').value.trim();
            const password = document.getElementById('password-input').value;

            if (authMode === 'signup') {
                const { error } = await db.auth.signUp({ email, password });
                if (error) alert("Registrierungsfehler: " + error.message);
                else alert("Konto erfolgreich erstellt! Du kannst dich jetzt anmelden.");
            } else {
                const { error } = await db.auth.signInWithPassword({ email, password });
                if (error) alert("Anmeldefehler: " + error.message);
            }
        }

        async function logout() {
            await db.auth.signOut();
            location.reload();
        }

        async function fetchProducts() {
            const { data, error } = await db.from('products').select('*');
            if (error) return console.error(error);
            allProducts = data || [];
            renderProducts();
        }

        function renderProducts() {
            const list = document.getElementById('product-list');
            if (allProducts.length === 0) {
                list.innerHTML = `<div class="text-center text-gray-400 py-10 text-sm">Keine Produkte vorhanden.</div>`;
                return;
            }

            list.innerHTML = allProducts.map(p => `
                <div class="bg-white p-4 rounded-2xl shadow-sm border border-gray-100 flex items-center justify-between">
                    <div>
                        <h4 class="font-semibold text-gray-900 text-sm">${p.name}</h4>
                        <p class="text-xs text-gray-500">Bestand: ${p.stock ?? 0}</p>
                    </div>
                    <div class="flex items-center space-x-2">
                        <button onclick="updateStock('${p.id}', ${(p.stock ?? 0) - 1})" class="w-8 h-8 rounded-lg bg-gray-100 font-bold text-lg">-</button>
                        <button onclick="updateStock('${p.id}', ${(p.stock ?? 0) + 1})" class="w-8 h-8 rounded-lg bg-blue-50 text-blue-600 font-bold text-lg">+</button>
                    </div>
                </div>
            `).join('');

            lucide.createIcons();
        }

        async function updateStock(id, newStock) {
            if (newStock < 0) return;
            const { error } = await db.from('products').update({ stock: newStock }).eq('id', id);
            if (!error) fetchProducts();
        }

        function openModal() {
            document.getElementById('prod-name').value = '';
            document.getElementById('prod-stock').value = '';
            document.getElementById('product-modal').classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('product-modal').classList.add('hidden');
        }

        async function saveProduct() {
            const name = document.getElementById('prod-name').value.trim();
            const stock = parseInt(document.getElementById('prod-stock').value) || 0;

            if (!name) return alert("Bitte Name eingeben.");

            const { error } = await db.from('products').insert([{ name, stock }]);
            if (error) alert("Fehler: " + error.message);
            else {
                closeModal();
                fetchProducts();
            }
        }
    </script>
</body>
</html>
