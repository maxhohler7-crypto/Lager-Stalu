<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>LagerManager</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- HTML5 Barcode/QR Code Scanner Library -->
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-font-smoothing: antialiased;
        }

            border-radius: 1.5rem;
            object-fit: cover;

            text-decoration: line-through;

        }

</head>
<body class="bg-gray-100 text-gray-900 min-h-screen">

    <script>
        const SUPABASE_URL = 'https://rcyxndcehfqrsngbmbpy.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_GQykkrMBRLmtWb8qPZVW9w_875r7bAz';
        const db = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    </script>

    <!-- Login & Registrierung -->
    <div id="auth-screen" class="min-h-screen flex items-center justify-center p-6 bg-gradient-to-b from-gray-50 to-gray-200">
        <div class="bg-white/80 backdrop-blur-xl p-8 rounded-3xl shadow-2xl border border-white/60 max-w-sm w-full space-y-6 text-center">
            <div class="w-20 h-20 bg-blue-500/10 text-blue-600 rounded-3xl flex items-center justify-center mx-auto shadow-inner">
                <i data-lucide="box" class="w-10 h-10"></i>
            </div>
            <div>
                <h1 class="text-3xl font-extrabold tracking-tight text-gray-900">LagerManager</h1>
                <p class="text-xs text-gray-500 mt-1 font-medium">Anmeldung für Ihr Lager</p>
            </div>
            <form onsubmit="handleAuth(event)" class="space-y-3">
                <input type="email" id="email-input" placeholder="E-Mail-Adresse" required class="w-full px-4 py-3.5 rounded-2xl bg-gray-100/80 border border-gray-200/50 text-sm focus:bg-white focus:outline-none focus:ring-2 focus:ring-blue-500 transition-all">
                <input type="password" id="password-input" placeholder="Passwort" required class="w-full px-4 py-3.5 rounded-2xl bg-gray-100/80 border border-gray-200/50 text-sm focus:bg-white focus:outline-none focus:ring-2 focus:ring-blue-500 transition-all">
                
                <div class="pt-2 space-y-2.5">
                    <button type="submit" onclick="authMode = 'login'" class="w-full py-3.5 bg-blue-600 hover:bg-blue-700 active:scale-98 text-white font-semibold rounded-2xl shadow-lg shadow-blue-500/25 transition-all text-sm">
                        Anmelden
                    </button>
                    <button type="submit" onclick="authMode = 'signup'" class="w-full py-3.5 bg-gray-200/60 hover:bg-gray-200 active:scale-98 text-gray-800 font-semibold rounded-2xl transition-all text-sm">
                        Neues Konto erstellen
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- Haupt-App -->
    <div id="app-screen" class="hidden max-w-md mx-auto min-h-screen flex flex-col pb-24">
        <!-- Header -->
        <header class="bg-white/80 backdrop-blur-md border-b border-gray-200/60 px-6 py-4 flex items-center justify-between sticky top-0 z-20">
            <div class="flex items-center space-x-3">
                <button id="back-btn" onclick="showBoxOverview()" class="hidden w-9 h-9 rounded-full bg-gray-100/80 hover:bg-gray-200 active:scale-90 text-gray-700 flex items-center justify-center transition-all">
                    <i data-lucide="chevron-left" class="w-5 h-5"></i>
                </button>
                <div>
                    <h2 id="header-title" class="text-xl font-bold tracking-tight text-gray-900">Lager</h2>
                    <p id="user-email" class="text-[11px] font-medium text-gray-400"></p>
                </div>
            </div>
            <div class="flex items-center space-x-2">
                <button id="add-btn" onclick="handlePlusButtonClick()" class="w-9 h-9 bg-blue-600 hover:bg-blue-700 active:scale-90 text-white rounded-full flex items-center justify-center shadow-md shadow-blue-500/30 transition-all">
                    <i data-lucide="plus" class="w-5 h-5"></i>
                </button>
                <button onclick="logout()" class="w-9 h-9 bg-gray-100 hover:bg-gray-200 active:scale-90 text-gray-500 rounded-full flex items-center justify-center transition-all">
                    <i data-lucide="log-out" class="w-4 h-4"></i>
                </button>
            </div>
        </header>

        <!-- Warnbanner bei geringem Bestand -->
        <div id="low-stock-banner" class="hidden mx-4 mt-4 p-4 bg-amber-500/10 border border-amber-500/20 backdrop-blur-md rounded-2xl text-amber-900 text-xs flex items-center space-x-3 shadow-sm">
            <div class="w-8 h-8 rounded-xl bg-amber-500/20 text-amber-700 flex items-center justify-center shrink-0">
                <i data-lucide="alert-triangle" class="w-4 h-4"></i>
            </div>
            <span id="low-stock-text" class="font-medium">Achtung: Einige Produkte haben einen niedrigen Bestand!</span>
        </div>

        <!-- Hauptinhalt -->
        <main class="p-4 flex-1 space-y-3" id="content-list">
            <div class="text-center text-gray-400 py-16 text-sm font-medium">Lade Daten...</div>
        </main>

        <!-- Untere Navigationsleiste -->
        <nav class="fixed bottom-0 left-0 right-0 max-w-md mx-auto bg-white/80 backdrop-blur-xl border-t border-gray-200/60 py-2 px-3 flex justify-between items-center z-30">
            <button id="tab-lager" onclick="switchTab('lager')" class="flex flex-col items-center text-blue-600 transition-all active:scale-95 w-14">
                <i data-lucide="box" class="w-5 h-5"></i>
                <span class="text-[10px] font-semibold mt-1">Lager</span>
            </button>

            <button id="tab-auftraege" onclick="switchTab('auftraege')" class="flex flex-col items-center text-gray-400 hover:text-gray-600 transition-all active:scale-95 w-14">

                <span class="text-[10px] font-semibold mt-1">Aufträge</span>
            </button>
            
            <button onclick="openQuickAddModal()" class="flex flex-col items-center justify-center -mt-5 transition-all active:scale-90">
                <div class="w-12 h-12 bg-gradient-to-tr from-blue-600 to-indigo-500 text-white p-3 rounded-full shadow-lg shadow-blue-500/40 border-4 border-gray-100 flex items-center justify-center">
                    <i data-lucide="scan-barcode" class="w-5 h-5"></i>
                </div>
                <span class="text-[10px] font-bold text-blue-600 mt-1">Eingang</span>
            </button>

            <button id="tab-reklamationen" onclick="switchTab('reklamationen')" class="flex flex-col items-center text-gray-400 hover:text-gray-600 transition-all active:scale-95 w-14">
                <i data-lucide="alert-circle" class="w-5 h-5"></i>
                <span class="text-[10px] font-semibold mt-1">Reklas</span>
            </button>

            <button id="tab-mitarbeiter" onclick="switchTab('mitarbeiter')" class="flex flex-col items-center text-gray-400 hover:text-gray-600 transition-all active:scale-95 w-14">
                <i data-lucide="users" class="w-5 h-5"></i>
                <span class="text-[10px] font-semibold mt-1">Team</span>
            </button>
        </nav>
    </div>

    <!-- Modal 1: Produkt hinzufügen (Lager) -->
    <div id="add-product-modal" class="fixed inset-0 bg-black/40 backdrop-blur-sm hidden flex items-center justify-center p-4 z-50">
        <div class="bg-white rounded-3xl p-6 max-w-sm w-full space-y-4 shadow-2xl border border-gray-100">
            <div class="flex justify-between items-center border-b border-gray-100 pb-2">
                <h3 class="text-lg font-bold text-gray-900">Neues Produkt erstellen</h3>
                <button onclick="closeProductModal()" class="w-8 h-8 rounded-full bg-gray-100 text-gray-400 flex items-center justify-center"><i data-lucide="x" class="w-4 h-4"></i></button>
            </div>
            <form onsubmit="saveNewProduct(event)" class="space-y-3">
                <input type="text" id="new-prod-name" placeholder="Produktname" required class="w-full px-4 py-2.5 rounded-xl bg-gray-100 border border-gray-200 text-sm focus:bg-white focus:outline-none focus:ring-2 focus:ring-blue-500">
                <input type="text" id="new-prod-box" placeholder="Kiste / Kategorie (z.B. Kiste A)" required class="w-full px-4 py-2.5 rounded-xl bg-gray-100 border border-gray-200 text-sm focus:bg-white focus:outline-none focus:ring-2 focus:ring-blue-500">
                <div class="flex space-x-2">
                    <input type="number" id="new-prod-stock" placeholder="Anfangsbestand" required class="w-1/2 px-4 py-2.5 rounded-xl bg-gray-100 border border-gray-200 text-sm focus:bg-white focus:outline-none focus:ring-2 focus:ring-blue-500">
                    <input type="number" id="new-prod-min" placeholder="Mindestbestand" value="5" class="w-1/2 px-4 py-2.5 rounded-xl bg-gray-100 border border-gray-200 text-sm focus:bg-white focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>
                <input type="text" id="new-prod-barcode" placeholder="Barcode / EAN (Optional)" class="w-full px-4 py-2.5 rounded-xl bg-gray-100 border border-gray-200 text-sm focus:bg-white focus:outline-none focus:ring-2 focus:ring-blue-500">
                <button type="submit" class="w-full py-3 bg-blue-600 hover:bg-blue-700 text-white font-semibold rounded-xl text-sm shadow-md shadow-blue-500/20">Produkt Speichern</button>
            </form>
        </div>
    </div>

    <!-- Modal 2: Auftrag hinzufügen (inkl. Stückzahl) -->
    <div id="add-auftrag-modal" class="fixed inset-0 bg-black/40 backdrop-blur-sm hidden flex items-center justify-center p-4 z-50">
        <div class="bg-white rounded-3xl p-6 max-w-sm w-full space-y-4 shadow-2xl border border-gray-100">
            <div class="flex justify-between items-center border-b border-gray-100 pb-2">
                <h3 class="text-lg font-bold text-gray-900">Neuen Auftrag anlegen</h3>
                <button onclick="closeAuftragModal()" class="w-8 h-8 rounded-full bg-gray-100 text-gray-400 flex items-center justify-center"><i data-lucide="x" class="w-4 h-4"></i></button>
            </div>
            <form onsubmit="saveNewAuftrag(event)" class="space-y-3">
                <input type="text" id="auftrag-title" placeholder="Auftragsnummer / Titel" required class="w-full px-4 py-2.5 rounded-xl bg-gray-100 border border-gray-200 text-sm focus:bg-white">
                <input type="text" id="auftrag-produkt" placeholder="Produktname" required class="w-full px-4 py-2.5 rounded-xl bg-gray-100 border border-gray-200 text-sm focus:bg-white">
                
                <div>
                    <label class="block text-xs font-semibold text-gray-500 mb-1">Soll-Menge / Zu produzierende Stückzahl</label>
                    <input type="number" id="auftrag-target" placeholder="z.B. 50" required min="1" value="10" class="w-full px-4 py-2.5 rounded-xl bg-gray-100 border border-gray-200 text-sm focus:bg-white">
                </div>

                <div>
                    <label class="block text-xs font-semibold text-gray-500 mb-1">Foto aus Galerie/Kamera auswählen</label>
                    <input type="file" id="auftrag-file-input" accept="image/*" class="w-full text-xs text-gray-500 file:mr-3 file:py-2 file:px-4 file:rounded-xl file:border-0 file:text-xs file:font-semibold file:bg-indigo-50 file:text-indigo-700 hover:file:bg-indigo-100 cursor-pointer">
                </div>
                <div id="auftrag-image-preview-container" class="hidden">
                    <img id="auftrag-image-preview" src="" class="w-full h-32 object-cover rounded-xl border border-gray-200">
                </div>

                <button type="submit" class="w-full py-3 bg-indigo-600 hover:bg-indigo-700 text-white font-semibold rounded-xl text-sm shadow-md">Auftrag Erstellen</button>
            </form>
        </div>
    </div>

    <!-- Modal 3: Reklamation hinzufügen -->
    <div id="add-rekla-modal" class="fixed inset-0 bg-black/40 backdrop-blur-sm hidden flex items-center justify-center p-4 z-50">
        <div class="bg-white rounded-3xl p-6 max-w-sm w-full space-y-4 shadow-2xl border border-gray-100">
            <div class="flex justify-between items-center border-b border-gray-100 pb-2">
                <h3 class="text-lg font-bold text-gray-900">Neue Reklamation melden</h3>
                <button onclick="closeReklaModal()" class="w-8 h-8 rounded-full bg-gray-100 text-gray-400 flex items-center justify-center"><i data-lucide="x" class="w-4 h-4"></i></button>
            </div>
            <form onsubmit="saveNewRekla(event)" class="space-y-3">
                <input type="text" id="rekla-title" placeholder="Reklamations-Nr / Titel" required class="w-full px-4 py-2.5 rounded-xl bg-gray-100 border border-gray-200 text-sm focus:bg-white">
                <input type="text" id="rekla-produkt" placeholder="Betroffenes Produkt" required class="w-full px-4 py-2.5 rounded-xl bg-gray-100 border border-gray-200 text-sm focus:bg-white">
                <textarea id="rekla-grund" placeholder="Grund / Beschreibung des Mangels" required class="w-full px-4 py-2.5 rounded-xl bg-gray-100 border border-gray-200 text-sm focus:bg-white h-20"></textarea>
                
                <div>
                    <label class="block text-xs font-semibold text-gray-500 mb-1">Foto aus Galerie/Kamera hochladen</label>
                    <input type="file" id="rekla-file-input" accept="image/*" class="w-full text-xs text-gray-500 file:mr-3 file:py-2 file:px-4 file:rounded-xl file:border-0 file:text-xs file:font-semibold file:bg-amber-50 file:text-amber-700 hover:file:bg-amber-100 cursor-pointer">
                </div>
                <div id="rekla-image-preview-container" class="hidden">
                    <img id="rekla-image-preview" src="" class="w-full h-32 object-cover rounded-xl border border-gray-200">
                </div>

                <button type="submit" class="w-full py-3 bg-amber-600 hover:bg-amber-700 text-white font-semibold rounded-xl text-sm shadow-md">Reklamation Einreichen</button>
            </form>
        </div>
    </div>

    <!-- Modal 4: Wareneingang & Barcode Scanner -->
    <div id="quick-add-modal" class="fixed inset-0 bg-black/40 backdrop-blur-sm hidden flex items-end sm:items-center justify-center p-0 sm:p-4 z-50 transition-all">
        <div class="bg-white rounded-t-3xl sm:rounded-3xl p-6 max-w-sm w-full space-y-4 shadow-2xl border border-gray-100 max-h-[90vh] flex flex-col">
            <div class="flex justify-between items-center pb-1 border-b border-gray-100">
                <div>
                    <h3 class="text-lg font-bold text-gray-900">Wareneingang</h3>
                    <p class="text-xs text-gray-400">Scannen oder manuell auswählen</p>
                </div>
                <button onclick="closeQuickAddModal()" class="w-8 h-8 rounded-full bg-gray-100 text-gray-400 flex items-center justify-center hover:text-gray-600"><i data-lucide="x" class="w-4 h-4"></i></button>
            </div>

            <div id="scanner-container" class="hidden relative rounded-2xl overflow-hidden bg-black min-h-[200px]">
                <div id="reader" class="w-full"></div>
                <button onclick="stopScanner()" class="absolute top-2 right-2 bg-black/60 text-white px-3 py-1 rounded-full text-xs font-semibold backdrop-blur-md">Kamera schließen</button>
            </div>

            <button id="start-scan-btn" onclick="startScanner()" class="w-full py-3 bg-indigo-50 hover:bg-indigo-100 text-indigo-600 font-bold rounded-2xl flex items-center justify-center space-x-2 transition-all">
                <i data-lucide="camera" class="w-5 h-5"></i>
                <span class="text-sm">Barcode mit Kamera scannen</span>
            </button>

            <div class="relative">
                <i data-lucide="search" class="w-4 h-4 text-gray-400 absolute left-3.5 top-3.5"></i>
                <input type="text" id="quick-search" oninput="filterQuickAddList()" placeholder="Produkt oder Strichcode..." class="w-full pl-10 pr-4 py-2.5 rounded-2xl bg-gray-100 border border-gray-200/60 text-sm focus:bg-white focus:outline-none focus:ring-2 focus:ring-blue-500 transition-all">
            </div>

            <div id="quick-product-list" class="flex-1 overflow-y-auto space-y-2 pr-1 my-2"></div>

            <div id="quick-booking-form" class="hidden pt-3 border-t border-gray-100 space-y-3 bg-blue-50/50 p-3 rounded-2xl">
                <div class="flex justify-between items-center">
                    <span id="selected-product-name" class="font-bold text-sm text-gray-900"></span>
                    <div class="text-right text-xs text-gray-500">
                        <div id="selected-product-stock"></div>
                    </div>
                </div>
                <div class="flex space-x-2">
                    <input type="number" id="quick-quantity" placeholder="+ Menge (z.B. 100)" class="flex-1 px-4 py-2.5 rounded-xl bg-white border border-gray-200 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 font-bold">
                    <button onclick="submitQuickBooking()" class="px-5 py-2.5 bg-blue-600 hover:bg-blue-700 active:scale-95 text-white font-semibold rounded-xl text-sm shadow-md shadow-blue-500/20 transition-all">
                        Buchen
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal 5: Verlauf (über Team geöffnet) -->
    <div id="verlauf-modal" class="fixed inset-0 bg-black/40 backdrop-blur-sm hidden flex items-center justify-center p-4 z-50">
        <div class="bg-white rounded-3xl p-6 max-w-sm w-full space-y-4 shadow-2xl border border-gray-100 max-h-[85vh] flex flex-col">
            <div class="flex justify-between items-center border-b border-gray-100 pb-2">
                <div>
                    <h3 class="text-lg font-bold text-gray-900">Aktivitäten-Verlauf</h3>
                    <p class="text-xs text-gray-400">Historie aller Lageraktionen</p>
                </div>
                <button onclick="closeVerlaufModal()" class="w-8 h-8 rounded-full bg-gray-100 text-gray-400 flex items-center justify-center"><i data-lucide="x" class="w-4 h-4"></i></button>
            </div>

            <div id="verlauf-list" class="flex-1 overflow-y-auto space-y-2.5 pr-1 my-2"></div>

            <button onclick="closeVerlaufModal()" class="w-full py-3 bg-gray-100 hover:bg-gray-200 text-gray-700 font-bold rounded-2xl text-xs transition-all">
                Schließen
            </button>
        </div>
    </div>

    <script>
        let allProducts = [];
        
        let sampleAuftraege = [
            { id: 101, name: "Auftrag #A-101", produkt: "Musterprodukt A", targetQuantity: 50, producedQuantity: 10, image: "", erledigt: false }
        ];

        let sampleReklamationen = [
            { id: 1, name: "Reklamation #R-201", produkt: "Musterprodukt A", grund: "Verpackung beschädigt", image: "", status: "In Bearbeitung" }
        ];

        let sampleVerlauf = [
            { id: 1, user: "admin@lager.de", action: "Wareneingang gebucht", details: "+10 Stk. Musterprodukt A", time: "Vor 10 Min." }
        ];

        let authMode = 'login';
        let activeBox = null;
        let currentTab = 'lager';
        let currentUser = null;
        let selectedQuickProduct = null;
        let html5QrcodeScanner = null;

        let selectedReklaImageBase64 = "";
        let selectedAuftragImageBase64 = "";

        window.onload = async () => {
            lucide.createIcons();
            setupImageUploadListeners();

            const { data: { session } } = await db.auth.getSession();
            if (session) showApp(session.user);

            db.auth.onAuthStateChange((_event, session) => {
                if (session) showApp(session.user);
                else showAuth();
            });
        };

        function addVerlaufEntry(action, details) {
            const timeStr = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
            sampleVerlauf.unshift({
                id: Date.now(),
                user: currentUser ? currentUser.email : 'System',
                action: action,
                details: details,
                time: timeStr
            });
        }

        function setupImageUploadListeners() {
            document.getElementById('rekla-file-input').addEventListener('change', function(e) {
                const file = e.target.files[0];
                if (file) {
                    const reader = new FileReader();
                    reader.onload = function(event) {
                        selectedReklaImageBase64 = event.target.result;
                        document.getElementById('rekla-image-preview').src = selectedReklaImageBase64;
                        document.getElementById('rekla-image-preview-container').classList.remove('hidden');
                    };
                    reader.readAsDataURL(file);
                }
            });

            document.getElementById('auftrag-file-input').addEventListener('change', function(e) {
                const file = e.target.files[0];
                if (file) {
                    const reader = new FileReader();
                    reader.onload = function(event) {
                        selectedAuftragImageBase64 = event.target.result;
                        document.getElementById('auftrag-image-preview').src = selectedAuftragImageBase64;
                        document.getElementById('auftrag-image-preview-container').classList.remove('hidden');
                    };
                    reader.readAsDataURL(file);
                }
            });
        }

        function showApp(user) {
            currentUser = user;
            document.getElementById('auth-screen').classList.add('hidden');
            document.getElementById('app-screen').classList.remove('hidden');
            document.getElementById('user-email').innerText = user.email;
            
            ensureUserProfile(user);
            switchTab('lager');
        }

        async function ensureUserProfile(user) {
            await db.from('profiles').upsert({ id: user.id, email: user.email });
        }

        function showAuth() {
            document.getElementById('auth-screen').classList.remove('hidden');
            document.getElementById('app-screen').classList.add('hidden');
        }

        async function handleAuth(event) {
            event.preventDefault();
            const email = document.getElementById('email-input').value.trim();
            const password = document.getElementById('password-input').value;

            if (authMode === 'signup') {
                const { data, error } = await db.auth.signUp({ email, password });
                if (error) alert("Registrierungsfehler: " + error.message);
                else {
                    if(data.user) ensureUserProfile(data.user);
                    alert("Konto erfolgreich erstellt!");
                }
            } else {
                const { error } = await db.auth.signInWithPassword({ email, password });
                if (error) alert("Anmeldefehler: " + error.message);
            }
        }

        async function logout() {
            await db.auth.signOut();
            location.reload();
        }

        function switchTab(tab) {
            currentTab = tab;
            
            ['lager', 'auftraege', 'reklamationen', 'mitarbeiter'].forEach(t => {
                const btn = document.getElementById(`tab-${t}`);
                if(btn) {
                    btn.className = (t === tab) 
                        ? "flex flex-col items-center text-blue-600 transition-all active:scale-95 w-14" 
                        : "flex flex-col items-center text-gray-400 hover:text-gray-600 transition-all active:scale-95 w-14";
                }
            });

            const addBtn = document.getElementById('add-btn');

            if (tab === 'lager') {
                addBtn.classList.remove('hidden');
                fetchProducts();
            } else if (tab === 'auftraege') {
                addBtn.classList.remove('hidden');
                openAuftragsPortal();
            } else if (tab === 'reklamationen') {
                addBtn.classList.remove('hidden');
                openReklamationsPortal();
            } else if (tab === 'mitarbeiter') {
                addBtn.classList.add('hidden');
                document.getElementById('back-btn').classList.add('hidden');
                document.getElementById('header-title').innerText = "Team";
                renderTeamScreen();
            }
        }

        function handlePlusButtonClick() {
            if (currentTab === 'lager') {
                document.getElementById('add-product-modal').classList.remove('hidden');
            } else if (currentTab === 'auftraege') {
                document.getElementById('add-auftrag-modal').classList.remove('hidden');
            } else if (currentTab === 'reklamationen') {
                document.getElementById('add-rekla-modal').classList.remove('hidden');
            }
        }

        function closeProductModal() { document.getElementById('add-product-modal').classList.add('hidden'); }
        function closeAuftragModal() { 
            document.getElementById('add-auftrag-modal').classList.add('hidden'); 
            selectedAuftragImageBase64 = "";
            document.getElementById('auftrag-image-preview-container').classList.add('hidden');
        }
        function closeReklaModal() { 
            document.getElementById('add-rekla-modal').classList.add('hidden'); 
            selectedReklaImageBase64 = "";
            document.getElementById('rekla-image-preview-container').classList.add('hidden');
        }

        async function saveNewProduct(e) {
            e.preventDefault();
            const name = document.getElementById('new-prod-name').value;
            const category = document.getElementById('new-prod-box').value;
            const stock = parseInt(document.getElementById('new-prod-stock').value) || 0;
            const min_stock = parseInt(document.getElementById('new-prod-min').value) || 5;
            const barcode = document.getElementById('new-prod-barcode').value;

            const { error } = await db.from('products').insert([{ name, category, stock, min_stock, barcode }]);
            if (error) alert("Fehler: " + error.message);
            else {
                addVerlaufEntry("Produkt erstellt", `${name} (${stock} Stk.) in ${category}`);
                closeProductModal();
                fetchProducts();
            }
        }

        function saveNewAuftrag(e) {
            e.preventDefault();
            const title = document.getElementById('auftrag-title').value;
            const produkt = document.getElementById('auftrag-produkt').value;
            const targetQuantity = parseInt(document.getElementById('auftrag-target').value) || 1;

            sampleAuftraege.unshift({
                id: Date.now(),
                name: title,
                produkt: produkt,
                targetQuantity: targetQuantity,
                producedQuantity: 0,
                image: selectedAuftragImageBase64,
                erledigt: false
            });

            addVerlaufEntry("Auftrag angelegt", `${title} - ${targetQuantity}x ${produkt}`);
            closeAuftragModal();
            openAuftragsPortal();
        }

        function saveNewRekla(e) {
            e.preventDefault();
            const title = document.getElementById('rekla-title').value;
            const produkt = document.getElementById('rekla-produkt').value;
            const grund = document.getElementById('rekla-grund').value;

            sampleReklamationen.unshift({
                id: Date.now(),
                name: title,
                produkt: produkt,
                grund: grund,
                image: selectedReklaImageBase64,
                status: "Neu"
            });

            addVerlaufEntry("Reklamation gemeldet", `${title} (${produkt})`);
            closeReklaModal();
            openReklamationsPortal();
        }

        function isProductLow(p) {
            const min = p.min_stock ?? 5;
            return (p.stock ?? 0) <= min;
        }

        // --- LAGER TAB ---
        async function fetchProducts() {
            const { data, error } = await db.from('products').select('*');
            if (error) console.error(error);
            allProducts = data || [];
            
            checkLowStockGlobal();

            if (activeBox) {
                renderProductsInBox(activeBox);
            } else {
                renderBoxes();
            }
        }

        function checkLowStockGlobal() {
            const lowItems = allProducts.filter(p => isProductLow(p));
            const banner = document.getElementById('low-stock-banner');
            if (lowItems.length > 0 && currentTab === 'lager') {
                banner.classList.remove('hidden');
                document.getElementById('low-stock-text').innerText = 
                    `${lowItems.length} Artikel haben ihren Mindestbestand erreicht!`;
            } else {
                banner.classList.add('hidden');
            }
        }

        function renderBoxes() {
            activeBox = null;
            document.getElementById('header-title').innerText = "Kisten";
            document.getElementById('back-btn').classList.add('hidden');
            
            const list = document.getElementById('content-list');
            const boxes = [...new Set(allProducts.map(p => p.category || 'Allgemein'))];

            if (boxes.length === 0) {
                list.innerHTML = `<div class="text-center text-gray-400 py-16 text-sm font-medium">Noch keine Kisten vorhanden.<br>Tippe auf "+", um eine anzulegen.</div>`;
                return;
            }

            list.innerHTML = boxes.map(boxName => {
                const boxProds = allProducts.filter(p => (p.category || 'Allgemein') === boxName);
                const count = boxProds.length;
                const hasLowStock = boxProds.some(p => isProductLow(p));

                return `
                    <div onclick="openBox('${boxName}')" class="bg-white p-4 rounded-3xl shadow-sm border border-gray-100 hover:shadow-md active:scale-98 transition-all cursor-pointer flex items-center justify-between">
                        <div class="flex items-center space-x-3.5">
                            <div class="w-12 h-12 rounded-2xl ${hasLowStock ? 'bg-amber-50 text-amber-600' : 'bg-blue-50 text-blue-600'} flex items-center justify-center">
                                <i data-lucide="archive" class="w-6 h-6"></i>
                            </div>
                            <div>
                                <h4 class="font-bold text-gray-900 text-base">${boxName}</h4>
                                <p class="text-xs text-gray-400 font-medium">${count} Produkt(e)</p>
                            </div>
                        </div>
                        <div class="flex items-center space-x-2">
                            ${hasLowStock ? '<span class="w-2.5 h-2.5 bg-amber-500 rounded-full animate-pulse"></span>' : ''}
                            <i data-lucide="chevron-right" class="w-5 h-5 text-gray-300"></i>
                        </div>
                    </div>
                `;
            }).join('');

            lucide.createIcons();
        }

        function openBox(boxName) {
            activeBox = boxName;
            document.getElementById('header-title').innerText = boxName;
            document.getElementById('back-btn').classList.remove('hidden');
            renderProductsInBox(boxName);
        }

        function showBoxOverview() {
            switchTab('lager');
        }

        function renderProductsInBox(boxName) {
            const list = document.getElementById('content-list');
            const boxProducts = allProducts.filter(p => (p.category || 'Allgemein') === boxName);

            if (boxProducts.length === 0) {
                list.innerHTML = `<div class="text-center text-gray-400 py-16 text-sm font-medium">Diese Kiste ist leer.</div>`;
                return;
            }

            list.innerHTML = boxProducts.map(p => {
                const isLow = isProductLow(p);
                const min = p.min_stock ?? 5;

                return `
                    <div class="bg-white p-4 rounded-3xl shadow-sm border ${isLow ? 'border-amber-300 bg-amber-50/20' : 'border-gray-100'} flex flex-col space-y-3">
                        <div class="flex items-center justify-between">
                            <div>
                                <div class="flex items-center space-x-2">
                                    <h4 class="font-bold text-gray-900 text-sm">${p.name}</h4>
                                    ${isLow ? '<span class="text-[10px] font-extrabold bg-amber-100 text-amber-700 px-2 py-0.5 rounded-full">Gering</span>' : ''}
                                </div>
                                <p class="text-xs text-gray-400 font-medium mt-0.5">
                                    Bestand: <span class="font-bold ${isLow ? 'text-amber-600' : 'text-gray-700'}">${p.stock ?? 0}</span>
                                    <span class="text-[10px] text-gray-400 ml-1">(Min: ${min})</span>
                                </p>
                            </div>
                            <div class="flex items-center space-x-2">
                                <div class="flex items-center space-x-1.5 bg-gray-100 p-1 rounded-2xl">
                                    <button onclick="updateStockByName('${p.name}', ${(p.stock ?? 0) - 1})" class="w-8 h-8 rounded-xl bg-white text-gray-700 font-bold text-base shadow-sm active:scale-90 transition-all flex items-center justify-center">-</button>
                                    <button onclick="updateStockByName('${p.name}', ${(p.stock ?? 0) + 1})" class="w-8 h-8 rounded-xl bg-blue-600 text-white font-bold text-base shadow-sm active:scale-90 transition-all flex items-center justify-center">+</button>
                                </div>
                                <button onclick="deleteProduct('${p.id}', '${p.name}')" class="w-9 h-9 rounded-2xl bg-red-50 text-red-500 hover:bg-red-100 active:scale-90 transition-all flex items-center justify-center ml-1">
                                    <i data-lucide="trash-2" class="w-4 h-4"></i>
                                </button>
                            </div>
                        </div>

                        <div class="pt-2 border-t border-gray-100 flex space-x-2">
                            <button onclick="openReklamationsPortal('${p.name}')" class="flex-1 py-2 bg-amber-50 hover:bg-amber-100 text-amber-700 font-semibold rounded-xl text-xs flex items-center justify-center space-x-1 transition-all">
                                <i data-lucide="alert-circle" class="w-3.5 h-3.5"></i>
                                <span>Reklamations-Portal</span>
                            </button>
                            <button onclick="openAuftragsPortal('${p.name}')" class="flex-1 py-2 bg-indigo-50 hover:bg-indigo-100 text-indigo-700 font-semibold rounded-xl text-xs flex items-center justify-center space-x-1 transition-all">
                                <i data-lucide="clipboard-list" class="w-3.5 h-3.5"></i>
                                <span>Auftrags-Portal</span>
                            </button>
                        </div>
                    </div>
                `;
            }).join('');

            lucide.createIcons();
        }

        // --- AUFTRAGS-PORTAL (Mit Produktionsfortschritt) ---
        function openAuftragsPortal(filterProduktName = null) {
            document.getElementById('header-title').innerText = "Auftrags-Portal";
            document.getElementById('back-btn').classList.remove('hidden');
            
            const list = document.getElementById('content-list');
            const gefilterteAuftraege = filterProduktName 
                ? sampleAuftraege.filter(a => a.produkt === filterProduktName)
                : sampleAuftraege;

            let html = `
                <div class="bg-white p-4 rounded-3xl shadow-sm border border-gray-100 space-y-4">
                    <div class="flex justify-between items-center">
                        <h3 class="font-bold text-gray-900">Aufträge & Produktion</h3>
                        ${filterProduktName ? `<span class="text-xs text-indigo-600 font-semibold bg-indigo-50 px-2 py-1 rounded-lg">${filterProduktName}</span>` : ''}
                    </div>
                    
                    <div class="space-y-3">
            `;

            if (gefilterteAuftraege.length === 0) {
                html += `<div class="py-4 text-center text-gray-400 text-xs">Keine Aufträge vorhanden.</div>`;
            } else {
                gefilterteAuftraege.forEach(auftrag => {
                    const isDone = auftrag.producedQuantity >= auftrag.targetQuantity || auftrag.erledigt;
                    
                    html += `
                        <div class="p-3 bg-gray-50 border border-gray-100 rounded-2xl flex flex-col space-y-3">
                            <div class="flex items-center justify-between">
                                <div>
                                    <h5 class="font-bold text-gray-800 text-sm ${isDone ? 'line-through-text' : ''}">${auftrag.name}</h5>
                                    <p class="text-xs text-gray-500 font-medium">${auftrag.produkt}</p>
                                </div>
                                <button onclick="deleteAuftrag(${auftrag.id})" class="text-red-500 hover:text-red-700 p-1">
                                    <i data-lucide="trash-2" class="w-4 h-4"></i>
                                </button>
                            </div>

                            <!-- Produktions-Zähler -->
                            <div class="bg-white p-2.5 rounded-xl border border-gray-200/80 flex justify-between items-center">
                                <div>
                                    <span class="text-[11px] font-semibold text-gray-400 block">Produktionsfortschritt</span>
                                    <span class="text-xs font-bold ${isDone ? 'text-emerald-600' : 'text-gray-800'}">
                                        ${auftrag.producedQuantity} / ${auftrag.targetQuantity} Stk. ${isDone ? '✓ Fertig' : ''}
                                    </span>
                                </div>
                                <div class="flex items-center space-x-1.5 bg-gray-100 p-1 rounded-xl">
                                    <button onclick="updateAuftragQuantity(${auftrag.id}, -1)" class="w-7 h-7 rounded-lg bg-white text-gray-700 font-bold text-sm shadow-sm active:scale-90 transition-all">-</button>
                                    <button onclick="updateAuftragQuantity(${auftrag.id}, 1)" class="w-7 h-7 rounded-lg bg-indigo-600 text-white font-bold text-sm shadow-sm active:scale-90 transition-all">+</button>
                                </div>
                            </div>

                            ${auftrag.image ? `<img src="${auftrag.image}" class="w-full h-32 rounded-xl object-cover border border-gray-200">` : ''}
                        </div>
                    `;
                });
            }

            html += `
                    </div>
                </div>
            `;

            list.innerHTML = html;
            lucide.createIcons();
        }

        function updateAuftragQuantity(id, delta) {
            sampleAuftraege = sampleAuftraege.map(a => {
                if (a.id === id) {
                    const newQty = Math.max(0, a.producedQuantity + delta);
                    addVerlaufEntry("Produktion aktualisiert", `${a.name}: ${newQty}/${a.targetQuantity} Stk.`);
                    return {
                        ...a,
                        producedQuantity: newQty,
                        erledigt: newQty >= a.targetQuantity
                    };
                }
                return a;
            });
            openAuftragsPortal();
        }

        function deleteAuftrag(id) {
            if(!confirm("Auftrag wirklich löschen?")) return;
            sampleAuftraege = sampleAuftraege.filter(a => a.id !== id);
            openAuftragsPortal();
        }

        // --- REKLAMATIONS-PORTAL ---
        function openReklamationsPortal(filterProduktName = null) {
            document.getElementById('header-title').innerText = "Reklamations-Portal";
            document.getElementById('back-btn').classList.remove('hidden');

            const list = document.getElementById('content-list');
            const gefilterteReklas = filterProduktName 
                ? sampleReklamationen.filter(r => r.produkt === filterProduktName)
                : sampleReklamationen;

            let html = `
                <div class="bg-white p-4 rounded-3xl shadow-sm border border-gray-100 space-y-4">
                    <div class="flex justify-between items-center">
                        <h3 class="font-bold text-gray-900">Reklamationen</h3>
                        ${filterProduktName ? `<span class="text-xs text-amber-600 font-semibold bg-amber-50 px-2 py-1 rounded-lg">${filterProduktName}</span>` : ''}
                    </div>
                    
                    <div class="space-y-3">
            `;

            if (gefilterteReklas.length === 0) {
                html += `<div class="text-center text-gray-400 py-4 text-xs">Keine Reklamationen vorhanden.</div>`;
            } else {
                gefilterteReklas.forEach(rekla => {
                    html += `
                        <div class="p-3 bg-amber-50/40 border border-amber-100 rounded-2xl space-y-2">
                            <div class="flex justify-between items-start">
                                <div>
                                    <h5 class="font-bold text-gray-800 text-xs">${rekla.name}</h5>
                                    <p class="text-[11px] font-semibold text-amber-800">${rekla.produkt}</p>
                                </div>
                                <span class="text-[10px] font-bold bg-amber-100 text-amber-800 px-2 py-1 rounded-lg">${rekla.status}</span>
                            </div>
                            <p class="text-xs text-gray-600">${rekla.grund}</p>
                            ${rekla.image ? `<img src="${rekla.image}" class="w-full h-32 rounded-xl object-cover border border-amber-200 mt-2">` : ''}
                        </div>
                    `;
                });
            }

            html += `
                    </div>
                </div>
            `;

            list.innerHTML = html;
            lucide.createIcons();
        }

        // --- TEAM TAB ---
        async function renderTeamScreen() {
            const list = document.getElementById('content-list');
            
            // Lade angemeldete Nutzer/Profile aus Supabase
            const { data: profiles, error } = await db.from('profiles').select('*');

            let html = `
                <div class="space-y-4">
                    <!-- Verlauf Button -->
                    <button onclick="openVerlaufModal()" class="w-full py-4 bg-gradient-to-r from-blue-600 to-indigo-600 text-white font-bold rounded-3xl shadow-lg shadow-blue-500/25 flex items-center justify-center space-x-2 active:scale-98 transition-all">
                        <i data-lucide="history" class="w-5 h-5"></i>
                        <span>Verlaufs-Portal öffnen</span>
                    </button>

                    <!-- Mitarbeiter Liste -->
                    <div class="bg-white p-4 rounded-3xl shadow-sm border border-gray-100 space-y-3">
                        <h3 class="font-bold text-gray-900 text-sm border-b border-gray-100 pb-2">Registriertes Team</h3>
            `;

            if (error || !profiles || profiles.length === 0) {
                html += `<div class="p-3 text-xs text-gray-400 text-center">Keine Mitarbeiter gefunden.</div>`;
            } else {
                profiles.forEach(p => {
                    const isMe = p.email === currentUser?.email;
                    html += `
                        <div class="p-3 bg-gray-50 border border-gray-100 rounded-2xl flex items-center justify-between">
                            <div class="flex items-center space-x-3">
                                <div class="w-9 h-9 rounded-full bg-blue-100 text-blue-700 flex items-center justify-center font-bold text-xs">
                                    ${p.email ? p.email.substring(0, 2).toUpperCase() : 'MA'}
                                </div>
                                <div>
                                    <h5 class="font-bold text-gray-800 text-xs">${p.email}</h5>
                                    <span class="text-[10px] text-gray-400 font-medium">${isMe ? 'Aktuell angemeldet' : 'Mitarbeiter'}</span>
                                </div>
                            </div>
                            ${isMe ? '<span class="w-2.5 h-2.5 bg-emerald-500 rounded-full"></span>' : ''}
                        </div>
                    `;
                });
            }

            html += `
                    </div>
                </div>
            `;

            list.innerHTML = html;
            lucide.createIcons();
        }

        // --- VERLAUFS-PORTAL MODAL LOGIK ---
        function openVerlaufModal() {
            renderVerlaufList();
            document.getElementById('verlauf-modal').classList.remove('hidden');
        }

        function closeVerlaufModal() {
            document.getElementById('verlauf-modal').classList.add('hidden');
        }

        function renderVerlaufList() {
            const list = document.getElementById('verlauf-list');

            if (sampleVerlauf.length === 0) {
                list.innerHTML = `<div class="text-center text-gray-400 py-6 text-xs font-medium">Noch keine Aktivitäten vorhanden.</div>`;
                return;
            }

            list.innerHTML = sampleVerlauf.map(item => `
                <div class="p-3 bg-gray-50 border border-gray-100 rounded-2xl space-y-1">
                    <div class="flex justify-between items-center">
                        <span class="text-xs font-bold text-gray-900">${item.action}</span>
                        <span class="text-[10px] text-gray-400 font-medium">${item.time}</span>
                    </div>
                    <p class="text-xs text-gray-600 font-medium">${item.details}</p>
                    <div class="text-[10px] text-indigo-600 font-semibold pt-1">${item.user}</div>
                </div>
            `).join('');
        }

        async function updateStockByName(prodName, newStock) {
            if (newStock < 0) return;
            const { error } = await db.from('products').update({ stock: newStock }).eq('name', prodName);
            if (!error) {
                fetchProducts();
            }
        }

        async function deleteProduct(id, prodName) {
            if (!confirm(`Möchtest du "${prodName}" wirklich aus dieser Kiste löschen?`)) return;

            const { error } = await db.from('products').delete().eq('id', id);
            if (error) {
                alert("Fehler beim Löschen: " + error.message);
            } else {
                addVerlaufEntry("Produkt gelöscht", prodName);
                fetchProducts();
            }
        }

        // --- BARCODE SCANNER LOGIK ---
        function startScanner() {
            document.getElementById('scanner-container').classList.remove('hidden');
            document.getElementById('start-scan-btn').classList.add('hidden');

            html5QrcodeScanner = new Html5Qrcode("reader");
            html5QrcodeScanner.start(
                { facingMode: "environment" },
                { fps: 10, qrbox: { width: 250, height: 150 } },
                (decodedText) => {
                    stopScanner();
                    handleScannedCode(decodedText);
                },
                (errorMessage) => {}
            ).catch(err => {
                alert("Kamera-Zugriff nicht möglich: " + err);
                stopScanner();
            });
        }

        function stopScanner() {
            if (html5QrcodeScanner) {
                html5QrcodeScanner.stop().then(() => {
                    html5QrcodeScanner.clear();
                    html5QrcodeScanner = null;
                }).catch(() => {});
            }
            document.getElementById('scanner-container').classList.add('hidden');
            document.getElementById('start-scan-btn').classList.remove('hidden');
        }

        function handleScannedCode(barcodeText) {
            const foundProduct = allProducts.find(p => p.barcode === barcodeText || p.name.toLowerCase() === barcodeText.toLowerCase());

            if (foundProduct) {
                selectQuickProduct(foundProduct.name, foundProduct.stock ?? 0);
            } else {
                alert(`Barcode "${barcodeText}" wurde keinem Produkt zugeordnet.`);
                document.getElementById('quick-search').value = barcodeText;
                filterQuickAddList();
            }
        }

        function openQuickAddModal() {
            selectedQuickProduct = null;
            document.getElementById('quick-booking-form').classList.add('hidden');
            document.getElementById('quick-search').value = '';
            filterQuickAddList();
            document.getElementById('quick-add-modal').classList.remove('hidden');
        }

        function closeQuickAddModal() {
            stopScanner();
            document.getElementById('quick-add-modal').classList.add('hidden');
        }

        function filterQuickAddList() {
            const query = document.getElementById('quick-search').value.toLowerCase();
            const list = document.getElementById('quick-product-list');

            const uniqueMap = new Map();
            allProducts.forEach(p => {
                if (!uniqueMap.has(p.name.toLowerCase())) {
                    uniqueMap.set(p.name.toLowerCase(), p);
                }
            });
            const uniqueProducts = Array.from(uniqueMap.values());

            const filtered = uniqueProducts.filter(p => 
                p.name.toLowerCase().includes(query) || 
                (p.barcode && p.barcode.toLowerCase().includes(query))
            );

            if (filtered.length === 0) {
                list.innerHTML = `<div class="text-center text-gray-400 py-6 text-xs font-medium">Keine Produkte gefunden.</div>`;
                return;
            }

            list.innerHTML = filtered.map(p => `
                <div onclick="selectQuickProduct('${p.name}', ${p.stock ?? 0})" class="p-3 bg-gray-50 hover:bg-blue-50 border border-gray-100 rounded-2xl flex justify-between items-center cursor-pointer transition-all active:scale-98">
                    <div>
                        <h5 class="font-bold text-gray-900 text-sm">${p.name}</h5>
                        <p class="text-[11px] text-gray-400 font-medium">Kiste: ${p.category || 'Allgemein'}</p>
                    </div>
                    <div class="text-right">
                        <span class="text-xs font-bold text-gray-600 bg-white px-2.5 py-1 rounded-xl border border-gray-200">
                            Aktuell: ${p.stock ?? 0}
                        </span>
                    </div>
                </div>
            `).join('');

            lucide.createIcons();
        }

        function selectQuickProduct(name, currentStock) {
            selectedQuickProduct = { name, currentStock };
            document.getElementById('selected-product-name').innerText = name;
            document.getElementById('selected-product-stock').innerText = `Aktueller Bestand: ${currentStock}`;
            document.getElementById('quick-booking-form').classList.remove('hidden');
        }

        async function submitQuickBooking() {
            const mengeInput = document.getElementById('quick-quantity');
            const menge = parseInt(mengeInput.value);

            if (isNaN(menge) || menge <= 0 || !selectedQuickProduct) {
                alert("Bitte gib eine gültige Menge ein.");
                return;
            }

            const neuerBestand = selectedQuickProduct.currentStock + menge;
            await updateStockByName(selectedQuickProduct.name, neuerBestand);
            addVerlaufEntry("Wareneingang gebucht", `+${menge} Stk. ${selectedQuickProduct.name}`);
            
            mengeInput.value = '';
            closeQuickAddModal();
        }
    </script>
</body>
</html>
