<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lagerverwaltung Pro</title>
  
  <!-- React & Babel Frameworks -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  
  <!-- jsPDF & AutoTable für den PDF-Export -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.28/jspdf.plugin.autotable.min.js"></script>

  <!-- html5-qrcode für Kamera-Scanner -->
  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>
    :root {
      --bg-color: #ffffff;
      --text-color: #000000;
      --card-bg: #f9f9f9;
      --border-color: #ddd;
    }

    body.dark-mode {
      --bg-color: #121212;
      --text-color: #ffffff;
      --card-bg: #1e1e1e;
      --border-color: #333;
    }

    body {
      font-family: Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      margin: 0;
      padding: 0;
    }

    .header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 15px 20px;
      border-bottom: 1px solid var(--border-color);
    }

    .header-actions {
      display: flex;
      gap: 10px;
    }

    .settings-btn, .scan-btn {
      background: none;
      border: 1px solid var(--border-color);
      color: var(--text-color);
      font-size: 1.2rem;
      padding: 6px 12px;
      border-radius: 6px;
      cursor: pointer;
    }

    .container {
      padding: 20px;
      max-width: 600px;
      margin: 0 auto;
    }

    .item-card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 15px;
      margin-bottom: 12px;
    }

    .badge-low {
      color: #d9534f;
      font-weight: bold;
      font-size: 0.85rem;
      margin-top: 5px;
    }

    .quick-actions {
      display: flex;
      gap: 6px;
      margin-top: 10px;
    }

    .quick-actions button {
      flex: 1;
      padding: 6px;
      border: 1px solid var(--border-color);
      background: var(--bg-color);
      color: var(--text-color);
      border-radius: 4px;
      cursor: pointer;
      font-weight: bold;
    }

    /* Einstellungen Modal Overlay */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.5);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }

    .modal-content {
      background: var(--bg-color);
      color: var(--text-color);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      padding: 20px;
      width: 90%;
      max-width: 400px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
    }

    .modal-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin: 15px 0;
    }

    .btn-close {
      background: #333;
      color: white;
      border: none;
      width: 100%;
      padding: 10px;
      border-radius: 6px;
      margin-top: 15px;
      cursor: pointer;
    }

    #reader {
      width: 100%;
      margin-top: 10px;
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    const initialItems = [
      { id: '1', name: 'Spax Schrauben 4x40', barcode: '400123456789', quantity: 3, minQuantity: 10, unit: 'Packung' },
      { id: '2', name: 'Dübel 8mm', barcode: '400987654321', quantity: 25, minQuantity: 15, unit: 'Stück' }
    ];

    function App() {
      const [items, setItems] = useState(() => {
        const saved = localStorage.getItem('app_items');
        return saved ? JSON.parse(saved) : initialItems;
      });

      const [showSettings, setShowSettings] = useState(false);
      const [showScanner, setShowScanner] = useState(false);
      const [scannedResult, setScannedResult] = useState(null);

      const [settings, setSettings] = useState(() => {
        const saved = localStorage.getItem('app_settings');
        return saved ? JSON.parse(saved) : {
          darkMode: false,
          hapticFeedback: true,
          soundEnabled: true
        };
      });

      useEffect(() => {
        localStorage.setItem('app_items', JSON.stringify(items));
      }, [items]);

      useEffect(() => {
        localStorage.setItem('app_settings', JSON.stringify(settings));
        if (settings.darkMode) {
          document.body.classList.add('dark-mode');
        } else {
          document.body.classList.remove('dark-mode');
        }
      }, [settings]);

      // Kamera Scanner Initialisierung
      useEffect(() => {
        let html5QrcodeScanner;
        if (showScanner) {
          html5QrcodeScanner = new Html5QrcodeScanner("reader", {
            fps: 10,
            qrbox: { width: 250, height: 150 }
          });

          html5QrcodeScanner.render((decodedText) => {
            triggerFeedback();
            const matchedItem = items.find(i => i.barcode === decodedText);
            
            if (matchedItem) {
              setScannedResult({ success: true, item: matchedItem, barcode: decodedText });
            } else {
              setScannedResult({ success: false, barcode: decodedText });
            }
            
            html5QrcodeScanner.clear();
            setShowScanner(false);
          }, (error) => {
            // Ignoriere laufende Frame-Fehler
          });
        }

        return () => {
          if (html5QrcodeScanner) {
            html5QrcodeScanner.clear().catch(() => {});
          }
        };
      }, [showScanner, items]);

      const triggerFeedback = () => {
        if (settings.hapticFeedback && navigator.vibrate) {
          navigator.vibrate(40);
        }
        if (settings.soundEnabled) {
          try {
            const ctx = new (window.AudioContext || window.webkitAudioContext)();
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.frequency.value = 800;
            gain.gain.value = 0.1;
            osc.start();
            osc.stop(ctx.currentTime + 0.08);
          } catch(e) {}
        }
      };

      const updateQuantity = (id, change) => {
        setItems(prev => prev.map(item => {
          if (item.id === id) {
            return { ...item, quantity: Math.max(0, item.quantity + change) };
          }
          return item;
        }));
        triggerFeedback();
      };

      const exportPDF = () => {
        const { jsPDF } = window.jspdf;
        const doc = new jsPDF();
        doc.text("Lagerbestand", 14, 20);
        
        const tableRows = items.map(i => [
          i.name, i.barcode || '-', `${i.quantity} ${i.unit}`, `${i.minQuantity} ${i.unit}`
        ]);

        doc.autoTable({
          head: [["Artikel", "Barcode", "Menge", "Mindestbestand"]],
          body: tableRows,
          startY: 30
        });

        doc.save("Lagerbestand.pdf");
      };

      return (
        <div>
          {/* Kopfzeile */}
          <div className="header-bar">
            <h2 style={{ margin: 0 }}>Lagerbestand</h2>
            <div className="header-actions">
              <button className="scan-btn" onClick={() => setShowScanner(true)}>📷</button>
              <button className="settings-btn" onClick={() => setShowSettings(true)}>⚙️</button>
            </div>
          </div>

          <div className="container">
            {/* Benachrichtigung nach dem Scannen */}
            {scannedResult && (
              <div className="item-card" style={{ border: '2px solid #333' }}>
                {scannedResult.success ? (
                  <div>
                    <strong>Erkannt: {scannedResult.item.name}</strong>
                    <p style={{ margin: '5px 0' }}>Aktueller Bestand: {scannedResult.item.quantity} {scannedResult.item.unit}</p>
                    <div className="quick-actions">
                      <button onClick={() => updateQuantity(scannedResult.item.id, -1)}>-1</button>
                      <button onClick={() => updateQuantity(scannedResult.item.id, 1)}>+1</button>
                      <button onClick={() => updateQuantity(scannedResult.item.id, 5)}>+5</button>
                    </div>
                  </div>
                ) : (
                  <div>
                    <strong>Unbekannter Barcode: {scannedResult.barcode}</strong>
                    <p style={{ margin: '5px 0', fontSize: '0.9rem' }}>Kein Produkt mit diesem Barcode in der Liste gefunden.</p>
                  </div>
                )}
                <button 
                  style={{ width: '100%', marginTop: '10px', padding: '6px' }} 
                  onClick={() => setScannedResult(null)}
                >
                  Schließen
                </button>
              </div>
            )}

            {/* Artikelliste */}
            {items.map(item => {
              const isLow = item.quantity <= item.minQuantity;
              return (
                <div key={item.id} className="item-card">
                  <div style={{ display: 'flex', justifyContent: 'space-between' }}>
                    <strong>{item.name}</strong>
                    <span>{item.quantity} {item.unit}</span>
                  </div>
                  <div style={{ fontSize: '0.85rem', color: '#666' }}>Barcode: {item.barcode}</div>
                  
                  {isLow && <div className="badge-low">⚠️ Mindestbestand unterschritten!</div>}

                  {/* Schnellbuttons */}
                  <div className="quick-actions">
                    <button onClick={() => updateQuantity(item.id, -1)}>-1</button>
                    <button onClick={() => updateQuantity(item.id, 1)}>+1</button>
                    <button onClick={() => updateQuantity(item.id, 5)}>+5</button>
                    <button onClick={() => updateQuantity(item.id, 10)}>+10</button>
                  </div>
                </div>
              );
            })}
          </div>

          {/* Scanner Modal */}
          {showScanner && (
            <div className="modal-overlay" onClick={() => setShowScanner(false)}>
              <div className="modal-content" onClick={e => e.stopPropagation()}>
                <h3 style={{ marginTop: 0 }}>Barcode scannen</h3>
                <div id="reader"></div>
                <button className="btn-close" onClick={() => setShowScanner(false)}>Abbrechen</button>
              </div>
            </div>
          )}

          {/* Einstellungs-Fenster (Pop-up) */}
          {showSettings && (
            <div className="modal-overlay" onClick={() => setShowSettings(false)}>
              <div className="modal-content" onClick={e => e.stopPropagation()}>
                <h3 style={{ marginTop: 0 }}>⚙️ Einstellungen</h3>
                
                <div className="modal-row">
                  <span>Dark Mode</span>
                  <input 
                    type="checkbox" 
                    checked={settings.darkMode} 
                    onChange={e => setSettings({...settings, darkMode: e.target.checked})} 
                  />
                </div>

                <div className="modal-row">
                  <span>Vibration (Haptik)</span>
                  <input 
                    type="checkbox" 
                    checked={settings.hapticFeedback} 
                    onChange={e => setSettings({...settings, hapticFeedback: e.target.checked})} 
                  />
                </div>

                <div className="modal-row">
                  <span>Scanton (Beep)</span>
                  <input 
                    type="checkbox" 
                    checked={settings.soundEnabled} 
                    onChange={e => setSettings({...settings, soundEnabled: e.target.checked})} 
                  />
                </div>

                <div style={{ marginTop: '20px' }}>
                  <button 
                    onClick={exportPDF} 
                    style={{ width: '100%', padding: '8px', cursor: 'pointer' }}
                  >
                    📄 Bestandsliste (PDF) herunterladen
                  </button>
                </div>

                <button className="btn-close" onClick={() => setShowSettings(false)}>Schließen</button>
              </div>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
