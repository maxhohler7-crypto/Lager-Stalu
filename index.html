<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>LagerManager</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- HTML5 Barcode/QR Code Scanner Library -->
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-font-smoothing: antialiased;
        }
        #reader video {
            border-radius: 1.5rem;
            object-fit: cover;
        }
    </style>
</head>
<body class="bg-gray-100 text-gray-900 min-h-screen">

    <script>
        const SUPABASE_URL = 'https://rcyxndcehfqrsngbmbpy.supabase.co';
        const SUPABASE_ANON_KEY = 'DEIN_SUPABASE_ANON_KEY';
        const db = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    </script>

    <!-- Login & Registrierung -->
    <div id="auth-screen" class="min-h-screen flex items-center justify-center p-6 bg-gradient-to-b from-gray-50 to-gray-200">
        <div class="bg-white/80 backdrop-blur-xl p-8 rounded-3xl shadow-2xl border border-white/60 max-w-sm w-full space-y-6 text-center">
            <div class="w-20 h-20 bg-blue-500/10 text-blue-600 rounded-3xl flex items-center justify-center mx-auto shadow-inner">
                <i data-lucide="box" class="w-10 h-10"></i>
            </div>
            <div>
                <h1 class="text-3xl font-extrabold tracking-tight text-gray-900">LagerManager</h1>
                <p class="text-xs text-gray-500 mt-1 font-medium">Anmeldung für Ihr Lager</p>
            </div>
            <form onsubmit="handleAuth(event)" class="space-y-3">
                <input type="email" id="email-input" placeholder="E-Mail-Adresse" required class="w-full px-4 py-3.5 rounded-2xl bg-gray-100/80 border border-gray-200/50 text-sm focus:bg-white focus:outline-none focus:ring-2 focus:ring-blue-500 transition-all">
                <input type="password" id="password-input" placeholder="Passwort" required class="w-full px-4 py-3.5 rounded-2xl bg-gray-100/80 border border-gray-200/50 text-sm focus:bg-white focus:outline-none focus:ring-2 focus:ring-blue-500 transition-all">
                
                <div class="pt-2 space-y-2.5">
                    <button type="submit" onclick="authMode = 'login'" class="w-full py-3.5 bg-blue-600 hover:bg-blue-700 active:scale-98 text-white font-semibold rounded-2xl shadow-lg shadow-blue-500/25 transition-all text-sm">
                        Anmelden
                    </button>
                    <button type="submit" onclick="authMode = 'signup'" class="w-full py-3.5 bg-gray-200/60 hover:bg-gray-200 active:scale-98 text-gray-800 font-semibold rounded-2xl transition-all text-sm">
                        Neues Konto erstellen
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- Haupt-App Layout -->
    <div id="app-screen" class="hidden min-h-screen flex flex-col md:flex-row pb-24 md:pb-0">
        
        <!-- Linke Spalte (Sidebar für Desktop / Menü) -->
        <aside class="w-full md:w-64 bg-white border-r border-gray-200/80 p-5 flex flex-col justify-between hidden md:flex">
            <div class="space-y-6">
                <div class="flex items-center space-x-3 px-2">
                    <div class="w-10 h-10 bg-blue-600 text-white rounded-2xl flex items-center justify-center shadow-md shadow-blue-500/30">
                        <i data-lucide="box" class="w-6 h-6"></i>
                    </div>
                    <div>
                        <h1 class="font-bold text-gray-900 text-base leading-tight">LagerManager</h1>
                        <p id="user-email-sidebar" class="text-[11px] text-gray-400 font-medium truncate max-w-[130px]"></p>
                    </div>
                </div>

                <nav class="space-y-1">
                    <button onclick="switchTab('lager')" id="side-tab-lager" class="w-full flex items-center space-x-3 px-4 py-3 rounded-2xl text-sm font-semibold text-blue-600 bg-blue-50 transition-all">
                        <i data-lucide="box" class="w-5 h-5"></i>
                        <span>Lager / Kisten</span>
                    </button>
                    <button onclick="switchTab('assembly')" id="side-tab-assembly" class="w-full flex items-center space-x-3 px-4 py-3 rounded-2xl text-sm font-semibold text-gray-600 hover:bg-gray-100 transition-all">
                        <i data-lucide="wrench" class="w-5 h-5"></i>
                        <span>Montage-Aufträge</span>
                    </button>
                    <button onclick="switchTab('reklamation')" id="side-tab-reklamation" class="w-full flex items-center space-x-3 px-4 py-3 rounded-2xl text-sm font-semibold text-gray-600 hover:bg-gray-100 transition-all">
                        <i data-lucide="alert-octagon" class="w-5 h-5"></i>
                        <span>Reklamationen</span>
                    </button>
                    <button onclick="switchTab('verlauf')" id="side-tab-verlauf" class="w-full flex items-center space-x-3 px-4 py-3 rounded-2xl text-sm font-semibold text-gray-600 hover:bg-gray-100 transition-all">
                        <i data-lucide="history" class="w-5 h-5"></i>
                        <span>Verlauf</span>
                    </button>
                    <button onclick="switchTab('mitarbeiter')" id="side-tab-mitarbeiter" class="w-full flex items-center space-x-3 px-4 py-3 rounded-2xl text-sm font-semibold text-gray-600 hover:bg-gray-100 transition-all">
                        <i data-lucide="users" class="w-5 h-5"></i>
                        <span>Mitarbeiter</span>
                    </button>
                </nav>
            </div>

            <button onclick="logout()" class="flex items-center space-x-3 px-4 py-3 text-red-600 hover:bg-red-50 rounded-2xl text-sm font-semibold transition-all">
                <i data-lucide="log-out" class="w-5 h-5"></i>
                <span>Abmelden</span>
            </button>
        </aside>

        <!-- Rechte Hauptansicht -->
        <div class="flex-1 max-w-2xl mx-auto w-full flex flex-col">
            <!-- Header -->
            <header class="bg-white/80 backdrop-blur-md border-b border-gray-200/60 px-6 py-4 flex items-center justify-between sticky top-0 z-20">
                <div class="flex items-center space-x-3">
                    <button id="back-btn" onclick="showBoxOverview()" class="hidden w-9 h-9 rounded-full bg-gray-100/80 hover:bg-gray-200 active:scale-90 text-gray-700 flex items-center justify-center transition-all">
                        <i data-lucide="chevron-left" class="w-5 h-5"></i>
                    </button>
                    <div>
                        <h2 id="header-title" class="text-xl font-bold tracking-tight text-gray-900">Lager</h2>
                        <p id="user-email" class="text-[11px] font-medium text-gray-400 md:hidden"></p>
                    </div>
                </div>
                <div class="flex items-center space-x-2">
                    <button id="add-btn" onclick="openAddModal()" class="w-9 h-9 bg-blue-600 hover:bg-blue-700 active:scale-90 text-white rounded-full flex items-center justify-center shadow-md shadow-blue-500/30 transition-all">
                        <i data-lucide="plus" class="w-5 h-5"></i>
                    </button>
                    <button onclick="logout()" class="md:hidden w-9 h-9 bg-gray-100 hover:bg-gray-200 active:scale-90 text-gray-500 rounded-full flex items-center justify-center transition-all">
                        <i data-lucide="log-out" class="w-4 h-4"></i>
                    </button>
                </div>
            </header>

            <!-- Warnbanner bei geringem Bestand -->
            <div id="low-stock-banner" class="hidden mx-4 mt-4 p-4 bg-amber-500/10 border border-amber-500/20 backdrop-blur-md rounded-2xl text-amber-900 text-xs flex items-center space-x-3 shadow-sm">
                <div class="w-8 h-8 rounded-xl bg-amber-500/20 text-amber-700 flex items-center justify-center shrink-0">
                    <i data-lucide="alert-triangle" class="w-4 h-4"></i>
                </div>
                <span id="low-stock-text" class="font-medium">Achtung: Einige Produkte haben einen niedrigen Bestand!</span>
            </div>

            <!-- Hauptinhalt -->
            <main class="p-4 flex-1 space-y-3" id="content-list">
                <div class="text-center text-gray-400 py-16 text-sm font-medium">Lade Daten...</div>
            </main>

            <!-- Untere Navigationsleiste (Mobil) -->
            <nav class="md:hidden fixed bottom-0 left-0 right-0 bg-white/80 backdrop-blur-xl border-t border-gray-200/60 py-2 px-2 flex justify-around items-center z-30">
                <button id="tab-lager" onclick="switchTab('lager')" class="flex flex-col items-center text-blue-600 transition-all active:scale-95">
                    <i data-lucide="box" class="w-5 h-5"></i>
                    <span class="text-[9px] font-semibold mt-1">Lager</span>
                </button>
                <button id="tab-assembly" onclick="switchTab('assembly')" class="flex flex-col items-center text-gray-400 hover:text-gray-600 transition-all active:scale-95">
                    <i data-lucide="wrench" class="w-5 h-5"></i>
                    <span class="text-[9px] font-semibold mt-1">Montage</span>
                </button>
                
                <!-- Wareneingang Button -->
                <button onclick="openQuickAddModal()" class="flex flex-col items-center justify-center -mt-5 transition-all active:scale-90">
                    <div class="w-12 h-12 bg-gradient-to-tr from-blue-600 to-indigo-500 text-white p-3 rounded-full shadow-lg shadow-blue-500/40 border-4 border-gray-100 flex items-center justify-center">
                        <i data-lucide="scan-barcode" class="w-5 h-5"></i>
                    </div>
                    <span class="text-[9px] font-bold text-blue-600 mt-0.5">Eingang</span>
                </button>

                <button id="tab-reklamation" onclick="switchTab('reklamation')" class="flex flex-col items-center text-gray-400 hover:text-gray-600 transition-all active:scale-95">
                    <i data-lucide="alert-octagon" class="w-5 h-5"></i>
                    <span class="text-[9px] font-semibold mt-1">Reklamieren</span>
                </button>
                <button id="tab-verlauf" onclick="switchTab('verlauf')" class="flex flex-col items-center text-gray-400 hover:text-gray-600 transition-all active:scale-95">
                    <i data-lucide="history" class="w-5 h-5"></i>
                    <span class="text-[9px] font-semibold mt-1">Verlauf</span>
                </button>
            </nav>
        </div>
    </div>

    <!-- Modal: Standard Hinzufügen (Kiste / Produkt) -->
    <div id="add-modal" class="fixed inset-0 bg-black/30 backdrop-blur-sm hidden flex items-center justify-center p-4 z-50 transition-all">
        <div class="bg-white rounded-3xl p-6 max-w-sm w-full space-y-5 shadow-2xl border border-gray-100">
            <div class="flex justify-between items-center">
                <h3 id="modal-title" class="text-lg font-bold text-gray-900">Neue Kiste</h3>
                <button onclick="closeModal()" class="w-8 h-8 rounded-full bg-gray-100 text-gray-400 flex items-center justify-center hover:text-gray-600"><i data-lucide="x" class="w-4 h-4"></i></button>
            </div>
            <div class="space-y-3" id="modal-inputs"></div>
            <div class="flex space-x-3 pt-2">
                <button onclick="closeModal()" class="flex-1 py-3 bg-gray-100 hover:bg-gray-200 text-gray-700 rounded-2xl font-semibold text-sm transition-all">Abbrechen</button>
                <button onclick="submitModal()" class="flex-1 py-3 bg-blue-600 hover:bg-blue-700 text-white rounded-2xl font-semibold text-sm shadow-md shadow-blue-500/25 transition-all">Speichern</button>
            </div>
        </div>
    </div>

    <!-- Modal: Wareneingang & Barcode Scanner -->
    <div id="quick-add-modal" class="fixed inset-0 bg-black/40 backdrop-blur-sm hidden flex items-end sm:items-center justify-center p-0 sm:p-4 z-50 transition-all">
        <div class="bg-white rounded-t-3xl sm:rounded-3xl p-6 max-w-sm w-full space-y-4 shadow-2xl border border-gray-100 max-h-[90vh] flex flex-col">
            <div class="flex justify-between items-center pb-1 border-b border-gray-100">
                <div>
                    <h3 class="text-lg font-bold text-gray-900">Wareneingang</h3>
                    <p class="text-xs text-gray-400">Scannen oder manuell auswählen</p>
                </div>
                <button onclick="closeQuickAddModal()" class="w-8 h-8 rounded-full bg-gray-100 text-gray-400 flex items-center justify-center hover:text-gray-600"><i data-lucide="x" class="w-4 h-4"></i></button>
            </div>

            <!-- Kamera Scanner Bereich -->
            <div id="scanner-container" class="hidden relative rounded-2xl overflow-hidden bg-black min-h-[200px]">
                <div id="reader" class="w-full"></div>
                <button onclick="stopScanner()" class="absolute top-2 right-2 bg-black/60 text-white px-3 py-1 rounded-full text-xs font-semibold backdrop-blur-md">Kamera schliessen</button>
            </div>

            <button id="start-scan-btn" onclick="startScanner()" class="w-full py-3 bg-indigo-50 hover:bg-indigo-100 text-indigo-600 font-bold rounded-2xl flex items-center justify-center space-x-2 transition-all">
                <i data-lucide="camera" class="w-5 h-5"></i>
                <span class="text-sm">Barcode mit Kamera scannen</span>
            </button>

            <!-- Suchfeld -->
            <div class="relative">
                <i data-lucide="search" class="w-4 h-4 text-gray-400 absolute left-3.5 top-3.5"></i>
                <input type="text" id="quick-search" oninput="filterQuickAddList()" placeholder="Produkt oder Strichcode..." class="w-full pl-10 pr-4 py-2.5 rounded-2xl bg-gray-100 border border-gray-200/60 text-sm focus:bg-white focus:outline-none focus:ring-2 focus:ring-blue-500 transition-all">
            </div>

            <!-- Produktliste -->
            <div id="quick-product-list" class="flex-1 overflow-y-auto space-y-2 pr-1 my-2"></div>

            <!-- Eingabebereich für gewählte Ware -->
            <div id="quick-booking-form" class="hidden pt-3 border-t border-gray-100 space-y-3 bg-blue-50/50 p-3 rounded-2xl">
                <div class="flex justify-between items-center">
                    <span id="selected-product-name" class="font-bold text-sm text-gray-900"></span>
                    <span id="selected-product-stock" class="text-xs text-gray-500"></span>
                </div>
                <div class="flex space-x-2">
                    <input type="number" id="quick-quantity" placeholder="+ Menge (z.B. 100)" class="flex-1 px-4 py-2.5 rounded-xl bg-white border border-gray-200 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 font-bold">
                    <button onclick="submitQuickBooking()" class="px-5 py-2.5 bg-blue-600 hover:bg-blue-700 active:scale-95 text-white font-semibold rounded-xl text-sm shadow-md shadow-blue-500/20 transition-all">
                        Buchen
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
        let allProducts = [];
        let assemblyOrders = [];
        let reclamations = [];
        let authMode = 'login';
        let activeBox = null;
        let currentTab = 'lager';
        let currentUser = null;
        let selectedQuickProduct = null;
        let html5QrcodeScanner = null;

        window.onload = async () => {
            lucide.createIcons();
            const { data: { session } } = await db.auth.getSession();
            if (session) showApp(session.user);

            db.auth.onAuthStateChange((_event, session) => {
                if (session) showApp(session.user);
                else showAuth();
            });
        };

        function showApp(user) {
            currentUser = user;
            document.getElementById('auth-screen').classList.add('hidden');
            document.getElementById('app-screen').classList.remove('hidden');
            document.getElementById('user-email').innerText = user.email;
            if (document.getElementById('user-email-sidebar')) {
                document.getElementById('user-email-sidebar').innerText = user.email;
            }
            
            ensureUserProfile(user);
            switchTab('lager');
        }

        async function ensureUserProfile(user) {
            await db.from('profiles').upsert({ id: user.id, email: user.email });
        }

        function showAuth() {
            document.getElementById('auth-screen').classList.remove('hidden');
            document.getElementById('app-screen').classList.add('hidden');
        }

        async function handleAuth(event) {
            event.preventDefault();
            const email = document.getElementById('email-input').value.trim();
            const password = document.getElementById('password-input').value;

            if (authMode === 'signup') {
                const { data, error } = await db.auth.signUp({ email, password });
                if (error) alert("Registrierungsfehler: " + error.message);
                else {
                    if(data.user) ensureUserProfile(data.user);
                    alert("Konto erfolgreich erstellt!");
                }
            } else {
                const { error } = await db.auth.signInWithPassword({ email, password });
                if (error) alert("Anmeldefehler: " + error.message);
            }
        }

        async function logout() {
            await db.auth.signOut();
            location.reload();
        }

        function switchTab(tab) {
            currentTab = tab;
            
            const tabs = ['lager', 'assembly', 'reklamation', 'verlauf', 'mitarbeiter'];
            tabs.forEach(t => {
                const mobileBtn = document.getElementById(`tab-${t}`);
                if (mobileBtn) {
                    mobileBtn.className = (t === tab) 
                        ? "flex flex-col items-center text-blue-600 transition-all active:scale-95" 
                        : "flex flex-col items-center text-gray-400 hover:text-gray-600 transition-all active:scale-95";
                }
                const sideBtn = document.getElementById(`side-tab-${t}`);
                if (sideBtn) {
                    sideBtn.className = (t === tab)
                        ? "w-full flex items-center space-x-3 px-4 py-3 rounded-2xl text-sm font-semibold text-blue-600 bg-blue-50 transition-all"
                        : "w-full flex items-center space-x-3 px-4 py-3 rounded-2xl text-sm font-semibold text-gray-600 hover:bg-gray-100 transition-all";
                }
            });

            const addBtn = document.getElementById('add-btn');

            if (tab === 'lager') {
                addBtn.classList.remove('hidden');
                fetchProducts();
            } else if (tab === 'assembly') {
                addBtn.classList.add('hidden');
                document.getElementById('back-btn').classList.add('hidden');
                document.getElementById('header-title').innerText = "Montage-Aufträge";
                renderAssemblyOrders();
            } else if (tab === 'reklamation') {
                addBtn.classList.add('hidden');
                document.getElementById('back-btn').classList.add('hidden');
                document.getElementById('header-title').innerText = "Reklamationen";
                renderReclamations();
            } else if (tab === 'verlauf') {
                addBtn.classList.add('hidden');
                document.getElementById('back-btn').classList.add('hidden');
                document.getElementById('header-title').innerText = "Verlauf";
                renderActivityLog();
            } else if (tab === 'mitarbeiter') {
                addBtn.classList.add('hidden');
                document.getElementById('back-btn').classList.add('hidden');
                document.getElementById('header-title').innerText = "Mitarbeiter";
                renderEmployees();
            }
        }

        function isProductLow(p) {
            const min = p.min_stock ?? 5;
            return (p.stock ?? 0) <= min;
        }

        // --- LAGER TAB ---
        async function fetchProducts() {
            const { data, error } = await db.from('products').select('*');
            if (error) return console.error(error);
            allProducts = data || [];
            
            checkLowStockGlobal();

            if (activeBox) {
                renderProductsInBox(activeBox);
            } else {
                renderBoxes();
            }
        }

        function checkLowStockGlobal() {
            const lowItems = allProducts.filter(p => isProductLow(p));
            const banner = document.getElementById('low-stock-banner');
            if (lowItems.length > 0 && currentTab === 'lager') {
                banner.classList.remove('hidden');
                document.getElementById('low-stock-text').innerText = 
                    `${lowItems.length} Artikel haben ihren Mindestbestand erreicht!`;
            } else {
                banner.classList.add('hidden');
            }
        }

        function renderBoxes() {
            activeBox = null;
            document.getElementById('header-title').innerText = "Kisten";
            document.getElementById('back-btn').classList.add('hidden');
            
            const list = document.getElementById('content-list');
            const boxes = [...new Set(allProducts.map(p => p.category || 'Allgemein'))];

            if (boxes.length === 0) {
                list.innerHTML = `<div class="text-center text-gray-400 py-16 text-sm font-medium">Noch keine Kisten vorhanden.<br>Tippe auf "+", um eine anzulegen.</div>`;
                return;
            }

            list.innerHTML = boxes.map(boxName => {
                const count = allProducts.filter(p => (p.category || 'Allgemein') === boxName).length;
                const hasLowStock = allProducts.some(p => (p.category || 'Allgemein') === boxName && isProductLow(p));

                return `
                    <div onclick="openBox('${boxName}')" class="bg-white p-4 rounded-3xl shadow-sm border border-gray-100 hover:shadow-md active:scale-98 transition-all flex items-center justify-between cursor-pointer">
                        <div class="flex items-center space-x-3.5">
                            <div class="w-12 h-12 rounded-2xl ${hasLowStock ? 'bg-amber-50 text-amber-600' : 'bg-blue-50 text-blue-600'} flex items-center justify-center">
                                <i data-lucide="archive" class="w-6 h-6"></i>
                            </div>
                            <div>
                                <h4 class="font-bold text-gray-900 text-base">${boxName}</h4>
                                <p class="text-xs text-gray-400 font-medium">${count} Produkt(e)</p>
                            </div>
                        </div>
                        <div class="flex items-center space-x-2">
                            ${hasLowStock ? '<span class="w-2.5 h-2.5 bg-amber-500 rounded-full animate-pulse"></span>' : ''}
                            <i data-lucide="chevron-right" class="w-5 h-5 text-gray-300"></i>
                        </div>
                    </div>
                `;
            }).join('');

            lucide.createIcons();
        }

        function openBox(boxName) {
            activeBox = boxName;
            document.getElementById('header-title').innerText = boxName;
            document.getElementById('back-btn').classList.remove('hidden');
            renderProductsInBox(boxName);
        }

        function showBoxOverview() {
            renderBoxes();
        }

        function renderProductsInBox(boxName) {
            const list = document.getElementById('content-list');
            const boxProducts = allProducts.filter(p => (p.category || 'Allgemein') === boxName);

            if (boxProducts.length === 0) {
                list.innerHTML = `<div class="text-center text-gray-400 py-16 text-sm font-medium">Diese Kiste ist leer.</div>`;
                return;
            }

            list.innerHTML = boxProducts.map(p => {
                const isLow = isProductLow(p);
                const min = p.min_stock ?? 5;
                return `
                    <div class="bg-white p-4 rounded-3xl shadow-sm border ${isLow ? 'border-amber-300 bg-amber-50/20' : 'border-gray-100'} flex items-center justify-between">
                        <div>
                            <div class="flex items-center space-x-2">
                                <h4 class="font-bold text-gray-900 text-sm">${p.name}</h4>
                                ${isLow ? '<span class="text-[10px] font-extrabold bg-amber-100 text-amber-700 px-2 py-0.5 rounded-full">Gering</span>' : ''}
                            </div>
                            <p class="text-xs text-gray-400 font-medium mt-0.5">
                                Bestand: <span class="font-bold ${isLow ? 'text-amber-600' : 'text-gray-700'}">${p.stock ?? 0}</span>
                                <span class="text-[10px] text-gray-400 ml-1">(Min: ${min})</span>
                            </p>
                            ${p.barcode ? `<p class="text-[10px] text-indigo-500 font-mono mt-0.5">Code: ${p.barcode}</p>` : ''}
                        </div>
                        <div class="flex items-center space-x-2">
                            <div class="flex items-center space-x-1.5 bg-gray-100 p-1 rounded-2xl">
                                <button onclick="updateStockByName('${p.name}', ${(p.stock ?? 0) - 1})" class="w-8 h-8 rounded-xl bg-white text-gray-700 font-bold text-base shadow-sm active:scale-90 transition-all flex items-center justify-center">-</button>
                                <button onclick="updateStockByName('${p.name}', ${(p.stock ?? 0) + 1})" class="w-8 h-8 rounded-xl bg-blue-600 text-white font-bold text-base shadow-sm active:scale-90 transition-all flex items-center justify-center">+</button>
                            </div>
                            <button onclick="deleteProduct('${p.id}', '${p.name}')" class="w-9 h-9 rounded-2xl bg-red-50 text-red-500 hover:bg-red-100 active:scale-90 transition-all flex items-center justify-center ml-1">
                                <i data-lucide="trash-2" class="w-4 h-4"></i>
                            </button>
                        </div>
                    </div>
                `;
            }).join('');

            lucide.createIcons();
        }

        async function updateStockByName(prodName, newStock) {
            if (newStock < 0) return;
            const { error } = await db.from('products').update({ stock: newStock }).eq('name', prodName);
            if (!error) {
                logActivity(`hat Bestand von "${prodName}" global auf ${newStock} geändert`);
                fetchProducts();
            }
        }

        async function deleteProduct(id, prodName) {
            if (!confirm(`Möchtest du "${prodName}" wirklich aus dieser Kiste löschen?`)) return;

            const { error } = await db.from('products').delete().eq('id', id);
            if (error) {
                alert("Fehler beim Löschen: " + error.message);
            } else {
                logActivity(`hat das Produkt "${prodName}" aus Kiste "${activeBox}" gelöscht`);
                fetchProducts();
            }
        }

        // --- MONTAGE-AUFTRÄGE (ZUSAMMENBAU) LOGIK ---
        async function fetchAssemblyOrders() {
            const { data, error } = await db.from('assembly_orders').select('*').order('created_at', { ascending: false });
            if (!error) assemblyOrders = data || [];
        }

        async function renderAssemblyOrders() {
            document.getElementById('low-stock-banner').classList.add('hidden');
            await fetchAssemblyOrders();
            const list = document.getElementById('content-list');

            let html = `
                <div class="bg-white p-4 rounded-3xl shadow-sm border border-gray-100 space-y-3">
                    <h4 class="font-bold text-gray-900 text-sm">Neuen Montage-Auftrag erstellen</h4>
                    <div class="flex space-x-2">
                        <input type="text" id="new-assembly-title" placeholder="Was muss zusammengebaut werden?" class="flex-1 px-4 py-2.5 rounded-2xl bg-gray-100 border border-gray-200/60 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                        <button onclick="addAssemblyOrder()" class="px-4 py-2.5 bg-blue-600 hover:bg-blue-700 text-white font-semibold rounded-2xl text-sm shadow-md transition-all">Hinzufügen</button>
                    </div>
                </div>
                <div class="space-y-2 pt-2">
            `;

            if (assemblyOrders.length === 0) {
                html += `<div class="text-center text-gray-400 py-10 text-sm font-medium">Keine offenen Montage-Aufträge.</div>`;
            } else {
                html += assemblyOrders.map(item => `
                    <div class="bg-white p-4 rounded-3xl shadow-sm border border-gray-100 flex items-center justify-between ${item.completed ? 'opacity-50 bg-gray-50' : ''}">
                        <div class="flex items-center space-x-3 flex-1 mr-2">
                            <input type="checkbox" ${item.completed ? 'checked' : ''} onchange="toggleAssemblyOrder('${item.id}', ${!item.completed})" class="w-5 h-5 accent-blue-600 rounded cursor-pointer">
                            <span class="text-sm font-semibold text-gray-900 ${item.completed ? 'line-through text-gray-500' : ''}">${item.title}</span>
                        </div>
                        <button onclick="deleteAssemblyOrder('${item.id}', '${item.title}')" class="w-8 h-8 rounded-xl bg-red-50 text-red-500 hover:bg-red-100 transition-all flex items-center justify-center shrink-0">
                            <i data-lucide="trash-2" class="w-4 h-4"></i>
                        </button>
                    </div>
                `).join('');
            }

            html += `</div>`;
            list.innerHTML = html;
            lucide.createIcons();
        }

        async function addAssemblyOrder() {
            const input = document.getElementById('new-assembly-title');
            const title = input.value.trim();
            if (!title) return alert("Bitte eine Beschreibung eingeben.");

            const { error } = await db.from('assembly_orders').insert([{ title, completed: false }]);
            if (error) {
                alert("Fehler beim Erstellen: " + error.message);
            } else {
                logActivity(`hat neuen Montage-Auftrag "${title}" erstellt`);
                input.value = '';
                renderAssemblyOrders();
            }
        }

        async function toggleAssemblyOrder(id, status) {
            await db.from('assembly_orders').update({ completed: status }).eq('id', id);
            renderAssemblyOrders();
        }

        async function deleteAssemblyOrder(id, title) {
            await db.from('assembly_orders').delete().eq('id', id);
            logActivity(`hat Montage-Auftrag "${title}" gelöscht`);
            renderAssemblyOrders();
        }

        // --- REKLAMATIONEN LOGIK ---
        async function fetchReclamations() {
            const { data, error } = await db.from('reclamations').select('*').order('created_at', { ascending: false });
            if (!error) reclamations = data || [];
        }

        async function renderReclamations() {
            document.getElementById('low-stock-banner').classList.add('hidden');
            await fetchProducts();
            await fetchReclamations();
            const list = document.getElementById('content-list');

            const uniqueProducts = [...new Set(allProducts.map(p => p.name))];

            let html = `
                <div class="bg-white p-4 rounded-3xl shadow-sm border border-gray-100 space-y-3">
                    <h4 class="font-bold text-gray-900 text-sm">Neue Reklamation erfassen</h4>
                    <select id="reclaim-product" class="w-full px-4 py-2.5 rounded-2xl bg-gray-100 border border-gray-200/60 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                        <option value="">-- Produkt auswählen --</option>
                        ${uniqueProducts.map(p => `<option value="${p}">${p}</option>`).join('')}
                    </select>
                    <input type="number" id="reclaim-count" placeholder="Anzahl fehlerhafter Teile" class="w-full px-4 py-2.5 rounded-2xl bg-gray-100 border border-gray-200/60 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                    <textarea id="reclaim-reason" placeholder="Grund der Reklamation (z.B. Kratzer, Defekt)..." class="w-full px-4 py-2.5 rounded-2xl bg-gray-100 border border-gray-200/60 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500" rows="2"></textarea>
                    
                    <div>
                        <label class="text-xs text-gray-400 font-semibold mb-1 block">Foto des Defekts (optional)</label>
                        <input type="file" id="reclaim-image" accept="image/*" class="w-full text-xs text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-xl file:border-0 file:text-xs file:font-semibold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100">
                    </div>

                    <button onclick="submitReclamation()" class="w-full py-3 bg-red-600 hover:bg-red-700 text-white font-semibold rounded-2xl text-sm shadow-md transition-all">Reklamation einreichen</button>
                </div>

                <div class="space-y-3 pt-2">
                    <h4 class="font-bold text-gray-900 text-sm px-1">Eingereichte Reklamationen</h4>
            `;

            if (reclamations.length === 0) {
                html += `<div class="text-center text-gray-400 py-10 text-sm font-medium">Bisher keine Reklamationen gemeldet.</div>`;
            } else {
                html += reclamations.map(r => `
                    <div class="bg-white p-4 rounded-3xl shadow-sm border border-red-100 space-y-2">
                        <div class="flex justify-between items-start">
                            <div>
                                <h5 class="font-bold text-gray-900 text-sm">${r.product_name}</h5>
                                <p class="text-xs text-red-600 font-semibold">Anzahl: ${r.count} Stück</p>
                            </div>
                            <span class="text-[10px] text-gray-400">${new Date(r.created_at).toLocaleDateString('de-DE')}</span>
                        </div>
                        <p class="text-xs text-gray-600 bg-gray-50 p-2.5 rounded-xl border border-gray-100">${r.reason}</p>
                        ${r.image_url ? `<img src="${r.image_url}" class="w-full h-32 object-cover rounded-xl border border-gray-100">` : ''}
                    </div>
                `).join('');
            }

            html += `</div>`;
            list.innerHTML = html;
        }

        async function submitReclamation() {
            const product = document.getElementById('reclaim-product').value;
            const count = parseInt(document.getElementById('reclaim-count').value);
            const reason = document.getElementById('reclaim-reason').value.trim();
            const imageFile = document.getElementById('reclaim-image').files[0];

            if (!product || isNaN(count) || count <= 0 || !reason) {
                return alert("Bitte Produkt, Anzahl und Grund angeben.");
            }

            let imageUrl = null;

            if (imageFile) {
                const fileExt = imageFile.name.split('.').pop();
                const fileName = `${Date.now()}.${fileExt}`;
                const { data, error } = await db.storage.from('reclamation-images').upload(fileName, imageFile);

                if (!error) {
                    const { data: publicUrlData } = db.storage.from('reclamation-images').getPublicUrl(fileName);
                    imageUrl = publicUrlData.publicUrl;
                }
            }

            const { error } = await db.from('reclamations').insert([{
                product_name: product,
                count,
                reason,
                image_url: imageUrl,
                created_by: currentUser.email
            }]);

            if (error) {
                alert("Fehler beim Erstellen der Reklamation: " + error.message);
            } else {
                logActivity(`hat Reklamation für "${product}" (${count} Stk.) eingereicht`);
                renderReclamations();
            }
        }

        // --- MODAL ZUM HINZUFÜGEN VON KISTEN/PRODUKTEN ---
        function openAddModal() {
            const inputs = document.getElementById('modal-inputs');
            const title = document.getElementById('modal-title');

            if (activeBox) {
                title.innerText = `Neues Produkt in "${activeBox}"`;
                inputs.innerHTML = `
                    <input type="text" id="new-prod-name" placeholder="Produktname" class="w-full px-4 py-3 rounded-2xl bg-gray-100 border border-gray-200/60 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                    <input type="number" id="new-prod-stock" placeholder="Anfangsbestand (z.B. 10)" class="w-full px-4 py-3 rounded-2xl bg-gray-100 border border-gray-200/60 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                    <input type="number" id="new-prod-min" placeholder="Mindestbestand (Standard: 5)" class="w-full px-4 py-3 rounded-2xl bg-gray-100 border border-gray-200/60 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                    <input type="text" id="new-prod-barcode" placeholder="Barcode / Strichcode (optional)" class="w-full px-4 py-3 rounded-2xl bg-gray-100 border border-gray-200/60 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                `;
            } else {
                title.innerText = "Neue Kiste anlegen";
                inputs.innerHTML = `
                    <input type="text" id="new-box-name" placeholder="Kisten-Name (z.B. Werkzeug)" class="w-full px-4 py-3 rounded-2xl bg-gray-100 border border-gray-200/60 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                    <p class="text-xs text-gray-400">Erstelle als Erstes ein Produkt in dieser Kiste, um sie zu speichern.</p>
                    <input type="text" id="new-prod-name" placeholder="Erstes Produkt in der Kiste" class="w-full px-4 py-3 rounded-2xl bg-gray-100 border border-gray-200/60 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                    <input type="number" id="new-prod-stock" placeholder="Anfangsbestand (z.B. 1)" class="w-full px-4 py-3 rounded-2xl bg-gray-100 border border-gray-200/60 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                `;
            }

            document.getElementById('add-modal').classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('add-modal').classList.add('hidden');
        }

        async function submitModal() {
            if (activeBox) {
                const name = document.getElementById('new-prod-name').value.trim();
                const stock = parseInt(document.getElementById('new-prod-stock').value) || 0;
                const min = parseInt(document.getElementById('new-prod-min').value) || 5;
                const barcode = document.getElementById('new-prod-barcode').value.trim();

                if (!name) return alert("Bitte einen Produktnamen eingeben.");

                const { error } = await db.from('products').insert([{
                    name, stock, category: activeBox, min_stock: min, barcode
                }]);

                if (error) {
                    alert("Fehler beim Erstellen: " + error.message);
                } else {
                    logActivity(`hat Produkt "${name}" in Kiste "${activeBox}" erstellt`);
                    closeModal();
                    fetchProducts();
                }
            } else {
                const boxName = document.getElementById('new-box-name').value.trim();
                const prodName = document.getElementById('new-prod-name').value.trim();
                const stock = parseInt(document.getElementById('new-prod-stock').value) || 0;

                if (!boxName || !prodName) return alert("Bitte Kistenname und das erste Produkt angeben.");

                const { error } = await db.from('products').insert([{
                    name: prodName, stock, category: boxName
                }]);

                if (error) {
                    alert("Fehler beim Erstellen der Kiste: " + error.message);
                } else {
                    logActivity(`hat Kiste "${boxName}" mit Produkt "${prodName}" angelegt`);
                    closeModal();
                    fetchProducts();
                }
            }
        }

        // --- BARCODE SCANNER LOGIK ---
        function startScanner() {
            document.getElementById('scanner-container').classList.remove('hidden');
            document.getElementById('start-scan-btn').classList.add('hidden');

            html5QrcodeScanner = new Html5Qrcode("reader");
            html5QrcodeScanner.start(
                { facingMode: "environment" },
                { fps: 10, qrbox: { width: 250, height: 150 } },
                (decodedText) => {
                    stopScanner();
                    handleScannedCode(decodedText);
                },
                (errorMessage) => {}
            ).catch(err => {
                alert("Kamera-Zugriff nicht möglich: " + err);
                stopScanner();
            });
        }

        function stopScanner() {
            if (html5QrcodeScanner) {
                html5QrcodeScanner.stop().then(() => {
                    html5QrcodeScanner.clear();
                    html5QrcodeScanner = null;
                }).catch(() => {});
            }
            document.getElementById('scanner-container').classList.add('hidden');
            document.getElementById('start-scan-btn').classList.remove('hidden');
        }

        function handleScannedCode(barcodeText) {
            const foundProduct = allProducts.find(p => p.barcode === barcodeText || p.name.toLowerCase() === barcodeText.toLowerCase());

            if (foundProduct) {
                selectQuickProduct(foundProduct.name, foundProduct.stock ?? 0);
            } else {
                alert(`Barcode "${barcodeText}" wurde keinem Produkt zugeordnet.\n\nDu kannst diesen Code jetzt beim Produkt eintragen.`);
                document.getElementById('quick-search').value = barcodeText;
                filterQuickAddList();
            }
        }

        // --- WARENEINGANG LOGIK ---
        function openQuickAddModal() {
            selectedQuickProduct = null;
            document.getElementById('quick-booking-form').classList.add('hidden');
            document.getElementById('quick-search').value = '';
            filterQuickAddList();
            document.getElementById('quick-add-modal').classList.remove('hidden');
        }

        function closeQuickAddModal() {
            stopScanner();
            document.getElementById('quick-add-modal').classList.add('hidden');
        }

        function filterQuickAddList() {
            const query = document.getElementById('quick-search').value.toLowerCase();
            const list = document.getElementById('quick-product-list');

            const uniqueMap = new Map();
            allProducts.forEach(p => {
                if (!uniqueMap.has(p.name.toLowerCase())) {
                    uniqueMap.set(p.name.toLowerCase(), p);
                }
            });
            const uniqueProducts = Array.from(uniqueMap.values());

            const filtered = uniqueProducts.filter(p => 
                p.name.toLowerCase().includes(query) || 
                (p.barcode && p.barcode.toLowerCase().includes(query))
            );

            if (filtered.length === 0) {
                list.innerHTML = `<div class="text-center text-gray-400 py-6 text-xs font-medium">Keine Produkte gefunden.</div>`;
                return;
            }

            list.innerHTML = filtered.map(p => `
                <div onclick="selectQuickProduct('${p.name}', ${p.stock ?? 0})" class="p-3 bg-gray-50 hover:bg-blue-50 border border-gray-100 rounded-2xl flex justify-between items-center cursor-pointer transition-all active:scale-98">
                    <div>
                        <h5 class="font-bold text-gray-900 text-sm">${p.name}</h5>
                        <p class="text-[11px] text-gray-400 font-medium">
                            Kiste: ${p.category || 'Allgemein'}
                            ${p.barcode ? ` | Code: ${p.barcode}` : ''}
                        </p>
                    </div>
                    <span class="text-xs font-bold text-gray-600 bg-white px-2.5 py-1 rounded-xl border border-gray-200">
                        Aktuell: ${p.stock ?? 0}
                    </span>
                </div>
            `).join('');
        }

        function selectQuickProduct(name, currentStock) {
            selectedQuickProduct = { name, currentStock };
            document.getElementById('selected-product-name').innerText = name;
            document.getElementById('selected-product-stock').innerText = `Aktueller Bestand: ${currentStock}`;
            document.getElementById('quick-quantity').value = '';
            document.getElementById('quick-booking-form').classList.remove('hidden');
            document.getElementById('quick-quantity').focus();
        }

        async function submitQuickBooking() {
            if (!selectedQuickProduct) return;
            const addQty = parseInt(document.getElementById('quick-quantity').value);

            if (isNaN(addQty) || addQty <= 0) {
                return alert("Bitte eine gültige Menge größer als 0 eingeben.");
            }

            const newTotalStock = selectedQuickProduct.currentStock + addQty;
            const { error } = await db.from('products').update({ stock: newTotalStock }).eq('name', selectedQuickProduct.name);

            if (error) {
                alert("Fehler beim Buchen: " + error.message);
            } else {
                logActivity(`hat Wareneingang von +${addQty} für "${selectedQuickProduct.name}" gebucht (Neuer Bestand: ${newTotalStock})`);
                closeQuickAddModal();
                fetchProducts();
            }
        }

        // --- VERLAUF TAB ---
        async function logActivity(actionText) {
            if (!currentUser) return;
            await db.from('activity_log').insert([{
                user_email: currentUser.email,
                action: actionText
            }]);
        }

        async function renderActivityLog() {
            document.getElementById('low-stock-banner').classList.add('hidden');
            const list = document.getElementById('content-list');
            list.innerHTML = `<div class="text-center text-gray-400 py-16 text-sm font-medium">Lade Verlauf...</div>`;

            const { data, error } = await db.from('activity_log').select('*').order('created_at', { ascending: false }).limit(30);

            if (error || !data || data.length === 0) {
                list.innerHTML = `<div class="text-center text-gray-400 py-16 text-sm font-medium">Noch keine Aktivitäten vorhanden.</div>`;
                return;
            }

            list.innerHTML = data.map(item => {
                const date = new Date(item.created_at).toLocaleString('de-DE', {
                    day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit'
                });
                return `
                    <div class="bg-white p-4 rounded-3xl shadow-sm border border-gray-100 flex items-start space-x-3">
                        <div class="w-10 h-10 rounded-2xl bg-blue-50 text-blue-600 flex items-center justify-center shrink-0 mt-0.5">
                            <i data-lucide="clock" class="w-5 h-5"></i>
                        </div>
                        <div class="flex-1">
                            <div class="flex justify-between items-center">
                                <span class="text-xs font-bold text-gray-900">${item.user_email}</span>
                                <span class="text-[10px] text-gray-400 font-medium">${date}</span>
                            </div>
                            <p class="text-xs text-gray-600 mt-1 font-medium">${item.action}</p>
                        </div>
                    </div>
                `;
            }).join('');

            lucide.createIcons();
        }

        // --- MITARBEITER TAB ---
        async function renderEmployees() {
            document.getElementById('low-stock-banner').classList.add('hidden');
            const list = document.getElementById('content-list');
            list.innerHTML = `<div class="text-center text-gray-400 py-16 text-sm font-medium">Lade Mitarbeiter...</div>`;

            const { data, error } = await db.from('profiles').select('*').order('created_at', { ascending: false });

            if (error || !data || data.length === 0) {
                list.innerHTML = `<div class="text-center text-gray-400 py-16 text-sm font-medium">Keine Mitarbeiter gefunden.</div>`;
                return;
            }

            list.innerHTML = data.map(emp => {
                const date = new Date(emp.created_at).toLocaleDateString('de-DE');
                return `
                    <div class="bg-white p-4 rounded-3xl shadow-sm border border-gray-100 flex items-center justify-between">
                        <div class="flex items-center space-x-3.5">
                            <div class="w-10 h-10 rounded-2xl bg-gray-100 text-gray-600 flex items-center justify-center font-bold text-sm">
                                ${emp.email ? emp.email.charAt(0).toUpperCase() : 'U'}
                            </div>
                            <div>
                                <h4 class="font-bold text-gray-900 text-sm">${emp.email}</h4>
                                <p class="text-[11px] text-gray-400 font-medium">Registriert seit: ${date}</p>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');

            lucide.createIcons();
        }
    </script>
</body>
